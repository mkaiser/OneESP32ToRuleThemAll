#########################################
#                                       #
#   Template Sensors                    #
#                                       #
#########################################

  - platform: template
    name: "Leistung ext. Heizkreispumpe"
    id: LEISTUNG_EXT_HEIZKREISPUMPE
    update_interval: never
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    lambda: |-
      return id(HEIZKREISPUMPE).state ? $static_leistung_heizkreispumpe : 0;  // power in watt shown at the pumps display, set this value in your top.yaml 

  - platform: integration
    name: "Energie ext. Heizkreispumpe"
    id: ENERGIE_EXT_HEIZKREISPUMPE
    sensor: LEISTUNG_EXT_HEIZKREISPUMPE
    time_unit: h
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # corresponding energy is provided by: EL_ENERGIEAUFNAHME_HEIZ_SUMME (wich has a better accuracy)
  - platform: template
    name: "Leistung Heizen"
    id: LEISTUNG_HEIZEN
    update_interval: never
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    # Heizbetriebs means that the verdichter is running. It can be either Warmwasser or Heizen.
    lambda: |-
      return id(LEISTUNG_EXT_HEIZKREISPUMPE).state + ( ( id(HEIZBETRIEB).state && !id(WARMWASSERBEREITUNG).state ) ? id(LEISTUNG_VERDICHTER).state : 0 );

  # corresponding energy is provided by: EL_ENERGIEAUFNAHME_WW_SUMME
  - platform: template
    name: "Leistung Warmwasserbereitung"
    id: LEISTUNG_WARMWASSERBEREITUNG
    update_interval: never
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    lambda: |-
      return id(WARMWASSERBEREITUNG).state ? id(LEISTUNG_VERDICHTER).state : 0;

  - platform: template
    name: "Leistung Summe"
    id: LEISTUNG_SUMME
    update_interval: never
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    lambda: |-
      return id(LEISTUNG_HEIZEN).state + id(LEISTUNG_WARMWASSERBEREITUNG).state;

  - platform: integration
    name: "Leistung Summe integrated"
    id: ENERGIE_SUNMME_INTEGRATED
    sensor: LEISTUNG_SUMME
    time_unit: h
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001


  - platform: template
    name: "Energie Summe"
    id: ENERGIE_SUMME
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    # use (estimated) Heizkreizpumpe and add EL_ENERGIEAUFNAHME_HEIZ_SUMME and EL_ENERGIEAUFNAHME_WW_SUMME for higher accuracy
    lambda: |-
      return id(ENERGIE_EXT_HEIZKREISPUMPE).state + id(EL_ENERGIEAUFNAHME_HEIZ_SUMME).state + id(EL_ENERGIEAUFNAHME_WW_SUMME).state;



#########################################
#                                       #
#   Home Assistant Actions              #
#                                       #
#########################################
api:
  actions:
    - action: can_send_raw_data
      variables:
        data: int[]
      then:
        - lambda: |-
            if(data.size() != 7U) {
              ESP_LOGE("ACTION", "Data is expected to have 7 elements, but has %zd .", data.size());
              return;
            }
            ESP_LOGI("ACTION", "Sending data (0x%02x 0x%02x 0x%02x 0x%02x 0x%02x 0x%02x 0x%02x)", data[0], data[1], data[2], data[3], data[4], data[5], data[6]);
            const auto use_extended_id{false};
            std::vector<std::uint8_t> payload;
            payload.resize(data.size());
            std::transform(data.begin(),data.end(),payload.begin(),[](const auto in){ return static_cast<std::uint8_t>(in);});
            id(wp_can).send_data(ESPClient.canId, use_extended_id, payload);
    - action: can_send_value
      variables:
        property: int
        target: string
        raw_value: int
      then:
        - lambda: |-
            Property mappedProperty(static_cast<std::uint16_t>(property));
            const auto value{static_cast<std::uint16_t>(raw_value)};
            if(const auto member = getCanMemberByName(target); member.has_value()) {
              ESP_LOGI("ACTION", "Sending value %d for property %s (0x%04x) to %s", value, std::string(mappedProperty.name).c_str(), mappedProperty.id, target.c_str());
              sendData(member.value(), mappedProperty, value);
            } else {
              ESP_LOGI("ACTION","No CanMember with name %s defined!", target.c_str());
            }


#########################################
#                                       #
#   CANbus configuration                #
#                                       #
#########################################
canbus:
  - id: wp_can
    can_id: $espclient_can_id
    use_extended_id: false
    bit_rate: 20kbps
    on_frame:
    - can_id: 0
      can_id_mask: 0
      then:
        - lambda: |-
            const auto fromCanMember = getCanMemberByCanId(can_id);
            ESP_LOGV("CAN", "Can message received from CANId 0x%04lx (%s)", can_id, fromCanMember ? fromCanMember->get().name.c_str() : "unknown member");

            if(fromCanMember) { // only process message, from known CAN members
              const auto [property, value] = processCanMessage(can_id, x);
              auto callback = CallbackHandler::instance().getCallback(std::make_pair(fromCanMember->get(),property));
              callback(value);
            } else {
              ESP_LOGW("CAN", "Ignoring message, because no CAN member with CANId 0x%04lx is known.", can_id);
            }
