#########################################
#                                       #
#   Template Update Triggers            #
#                                       #
#########################################

# trigger recalculation of LEISTUNG_*, when one of following sensors change
binary_sensor:
  - id: !extend HEIZKREISPUMPE
    on_state:
      then:
        - component.update: LEISTUNG_EXT_HEIZKREISPUMPE
        - component.update: LEISTUNG_SUMME

  - id: !extend HEIZBETRIEB
    on_state:
      then:      
        - component.update: LEISTUNG_HEIZEN
        - component.update: LEISTUNG_SUMME

  - id: !extend WARMWASSERBEREITUNG
    on_state:
      then:
        - component.update: LEISTUNG_WARMWASSERBEREITUNG
        - component.update: LEISTUNG_SUMME


text_sensor:
# Remove after Sommerbetrieb and Kühlbetrieb were tested
  - platform: template
    name: DEBUG_BETRIEB
    id: DEBUG_BETRIEB
    entity_category: "diagnostic"


#########################################
#                                       #
#   Home Assistant Sensors              #
#                                       #
#########################################
# trigger recalculation of LEISTUNG_*, when one of following sensors change
sensor:
  - id: !extend LEISTUNG_VERDICHTER
    on_value:
      then:
        - component.update: LEISTUNG_HEIZEN
        - component.update: LEISTUNG_WARMWASSERBEREITUNG
        - component.update: LEISTUNG_SUMME

