# General notes (Tecalor TTF* [C], (maybe) compatible with Stiebel Eltron WPF* )
# This configuration was created for a TTF07c heatpump. 
# 
# NOTES
# - The FEK needs to be de-attached, because if connected, the FEK will take over control of the heatpump and set temperatures. 
# - My heatpump has an external pump (Heizkreispumpe). This has a constant power consumption of 41W (displayed on the device itself).
#   Set $static_leistung_heizkreispumpe in your heatpump.yaml to the power consumption of your pump, if applicable (else just 0).
# - HA Energy dashboard (>2025.12). Add as "individual devices", the prefix of the sensors might differ (mine is "heatpump_")
#     - Wärmepumpe: 
#         - Device energy consumption: Energie Summe (heatpump_energie_summe)
#         - Device power consumption: Leistung Summe (heatpump_leistung_summe)
#         - Display name: Wärmepumpe
#         - Upstream Device: -
#     - Warmwasser: 
#         - Device energy consumption: El Energieaufnahme Warmwasser (heatpump_el_energieaufnahme_warmwasser)
#         - Device power consumption: Leistung Warmwasserbereitung (heatpump_leistung_warmwasserbereitung)
#         - Display name: Warmwasser
#         - Upstream Device: Wärmepumpe
#     - Heizung: 
#         - Device energy consumption: El Energieaufnahme Heizen (heatpump_el_energieaufnahme_heizen)
#         - Device power consumption: Leistung Heizen (heatpump_leistung_heizen)
#         - Display name: Heizung
#         - Upstream Device: Wärmepumpe
#     - Heizkreispumpe: 
#         - Device energy consumption: Energie ext. Heizkreispumpe (heatpump_energie_ext_heizkreispumpe)
#         - Device power consumption: Leistung ext. Heizkreispumpe (heatpump_leistung_ext_heizkreispumpe)
#         - Display name: Heizkreispumpe
#         - Upstream Device: Heizung
#
# Working
#  - Set 'Betriebszustand' (Komfort, Eco, Warmwasser, Bereitschaft, Notbetrieb)
#  - Set temperatures for heating and hot water (Komfort and Eco modes)
#  - Read many sensors (temperatures, pressures, energy consumption, operation times, status flags, etc.)
#  - Control some settings like Verdichter Stillstand, Pumpenleistung (Heizkreis, Sole, Warmwasser), Reglerdynamik, Steigung HK1, Raumeinfluss
#  - Power and energy readings of the heatpump (heating, hot water, total) and the external heating circuit pump --> HA dashboard compatible
#
# ToDo / open issues
# - Create nice thermostats. Challenge: 
#   There are basically two modes: ECO and Komfort. Each has its own setpoint for heating and hot water. The same for HK1 temperature
#   I usually just have the heatpump in ECO mode and control the ECO temperatures.
#   If we have two thermostats, which can both switch between Eco and komfort, this will affect the other thermostat as well. 
#
# - naming: Is NHZ3 actually NHZ1_2?
# - Kühlen was not tested, yet (its currently winter...)
# - Test transmiting RAUMISTTEMP and RAUMFEUCHTE from HA to heatpump (code is currently commmented)
 

substitutions:
  kessel_can_id: "0x180"
  hk1_can_id: "0x301"
  hk2_can_id: "0x302"   # unused in TTF07C
  manager_can_id: "0x100"
  espclient_can_id: "0x680"
  # WPM2: 0480
  # MFG: 0x700


esphome:
  includes:
    - OneESP32ToRuleThemAll/src/callback_handler.h
    - OneESP32ToRuleThemAll/src/communication.h
    - OneESP32ToRuleThemAll/src/mapper.h
    - OneESP32ToRuleThemAll/src/mapper.cpp
    - OneESP32ToRuleThemAll/src/property.h
    - OneESP32ToRuleThemAll/src/property.cpp
    - OneESP32ToRuleThemAll/src/simple_variant.h
    - OneESP32ToRuleThemAll/src/type.h
    - OneESP32ToRuleThemAll/src/type.cpp
    - OneESP32ToRuleThemAll/src/util.h
  platformio_options:
    build_flags:
      - "-DTTF_07_C"
      - "-DESPCLIENT_ID=$espclient_can_id"
      - "-DMANAGER_ID=$manager_can_id"
      - "-DKESSEL_ID=$kessel_can_id"
      - "-DHK1_ID=$hk1_can_id"
      - "-DHK2_ID=$hk2_can_id"
      # Ensure the integration component is actually linked
      # otherwise you may hit: undefined reference to vtable for esphome::integration::IntegrationSensor
      - "-DUSE_INTEGRATION"
      - "-DUSE_INTEGRATION_SENSOR"
  on_boot:
    priority: 100.0 # AFTER_CONNECTION
    then:
      - lambda: |-
          CallbackHandler::instance().addCallback(std::make_pair(WPM2,Property::kPROGRAMMSCHALTER),[](const SimpleVariant& value){
            const auto stringValue{value.get<std::string>()};
            //ESP_LOGI("PROGRAMMSCHALTER", "mapped value %s", stringValue.c_str());
            const auto index = id(PROGRAMMSCHALTER).index_of(stringValue);
            if(index.has_value()) {
              id(PROGRAMMSCHALTER).publish_state(stringValue);
            } 
          });
          queueRequest(WPM2, Property::kPROGRAMMSCHALTER);

          CallbackHandler::instance().addCallback(std::make_pair(WPM2,Property::kBETRIEBS_STATUS),[](const SimpleVariant& value){
            const std::uint16_t v = static_cast<std::uint16_t>(value);
            const std::bitset<16U> status_bits{v};

            // for debug string sensor
            const std::string s = status_bits.to_string();
            id(DEBUG_BETRIEB).publish_state(s);
            //ESP_LOGW("BETRIEBS_STATUS", "BETRIEBS_STATUS value= 0x%04lx str=%s", v, s.c_str());

            id(HEIZKREISPUMPE).publish_state(status_bits.test(0U));
            id(MISCHER_PUMPE).publish_state(status_bits.test(1U));
            id(MISCHER_AUF).publish_state(status_bits.test(2U));
            id(MISCHER_ZU).publish_state(status_bits.test(3U));
            id(NHZ1).publish_state(status_bits.test(7U) && !status_bits.test(5U) && status_bits.test(4U));   // 0x0090   [7_4] 1001
            id(NHZ2).publish_state(status_bits.test(7U) && status_bits.test(5U) && !status_bits.test(4U));   // 0x00A0   [7_4] 1010
            id(NHZ3).publish_state(status_bits.test(7U) && status_bits.test(5U) && status_bits.test(4U));   // 0x00B0   [7_4] 1011
            id(HEIZBETRIEB).publish_state(status_bits.test(7U));  //0x0080
            id(QUELLENPUMPE).publish_state(status_bits.test(6U));   // 0x0040 
            id(PUFFERLADEPUMPE).publish_state(status_bits.test(7U));  // 0x0080
            id(ENTLEERUNG_HYD).publish_state(status_bits.test(9U));  // 0x0200
            id(WARMWASSERBEREITUNG).publish_state(status_bits.test(9U) && status_bits.test(7U));  // 0x0280
            id(KUEHLBETRIEB).publish_state(status_bits.test(13U));   // 0x2000
            id(VERDICHTER).publish_state(status_bits.test(14U));  // 0x4000
          });
          queueRequest(WPM2, Property::kBETRIEBS_STATUS);


#########################################
#                                       #
#   Time Synchronization                #
#                                       #
#########################################
time:
  - platform: sntp
    id: sntp_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 3 # sync at 3 am should be ok even with switch from/to daylight saving time
        then:
          - lambda: |-
              syncTime();

#########################################
#                                       #
#   Buttons                             #
#                                       #
#########################################
button:
  - platform: template
    name: Synchronize Time
    on_press:
      then:
        - lambda: |-
            syncTime();


#########################################
#                                       #
#   Intervals                           #
#                                       #
#########################################
interval:
  - interval: 250ms
    then:
      - lambda: |-
          // Request sensor value one after another.
          if(!conditionalRequests.empty()) {
            // find the next request of which the condition evaluates to true
            auto it = std::find_if(conditionalRequests.begin(),conditionalRequests.end(),[](const auto& element){
              return element._condition();
            });
            if(it != conditionalRequests.end()) {
                requestData(it->_request.first, it->_request.second);
                conditionalRequests.erase(it);
            }
          }
  - interval: $interval_fast
    then:
    - lambda: |-
        queueRequest(WPM2, Property::kBETRIEBS_STATUS);          
        queueRequest(WPM2, Property::kPROGRAMMSCHALTER);

  # - interval: $interval_medium
  #   then:
  #     - lambda: |-
  #         // Send current RAUMISTTEMP
  #         const auto room_temp = id(gRAUMISTTEMP);
  #         if(room_temp > 0.0f) {
  #           ESP_LOGI("SET", "Sending cached room temperature %f to heatpump", room_temp);
  #           sendData(HK1, Property::kRAUMISTTEMP, static_cast<std::uint16_t>(room_temp * 10.0f));
  #         }
  #         // Send current RAUMFEUCHTE
  #         const auto humidity = id(gRAUMFEUCHTE);
  #         if(humidity > 0.0) {
  #           ESP_LOGI("SET", "Sending cached humidity %f to heatpump", humidity);
  #           sendData(HK1, Property::kRAUMFEUCHTE, static_cast<std::uint16_t>(humidity * 10.0f));
  #         }

#########################################
#                                       #
#   Selects                             #
#                                       #
#########################################
select:
  - platform: template
    name: "PROGRAMMSCHALTER"
    id: PROGRAMMSCHALTER
    options:
      - "Notbetrieb"
      - "Bereitschaft"
      - "Programm"
      - "Komfort"
      - "Eco"
      - "Warmwasser"
    optimistic: true
    setup_priority: 100
    set_action:
      then:
        - lambda: |-
            const auto betriebsartId = Mapper::instance().getBetriebsartId(x);
            if(betriebsartId.has_value()) {
              ESP_LOGI("ttf07.yaml:select", "Updating PROGRAMMSCHALTER to %s betriebsartId=0x%0x", x.c_str(), betriebsartId.value());
              sendData(WPM2, Property::kPROGRAMMSCHALTER, betriebsartId.value());
            }


