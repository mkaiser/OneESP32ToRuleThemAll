# Optional package for ttf07_wpm3i.yaml: German display names for the entities that ttf07_wpm3i.yaml names by their
# id (e.g. HKISTTEMP -> "HK Ist Temperatur"). Add it next to ttf07_wpm3i.yaml:
#
# packages:
#   wp: !include OneESP32ToRuleThemAll/yaml/ttf07_wpm3i.yaml
#   wp_names: !include OneESP32ToRuleThemAll/yaml/names/ttf07_wpm3i_de.yaml
#
# Choose before the first install: Home Assistant identifies ESPHome entities by their name, so adding, removing or
# switching a names package later creates new entities and their history starts again.
# Only for ttf07_wpm3i.yaml: every id must exist in the device file.

