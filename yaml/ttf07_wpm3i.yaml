# Tecalor TTF07 C (cool) with WPM3i manager (maybe compatible with Stiebel Eltron WPF*)
#
# Variant of ttf07_base.yaml (shared with ttf07.yaml): the entities of ttf07.yaml keep their names, so switching from
# ttf07.yaml keeps the Home Assistant history. Differences to ttf07.yaml, set here, by substitutions and !extend:
# - Betriebsstatus and Programmschalter are read from / written to the WPM3i manager (CAN 0x480 = CanNode::Manager),
#   not from the Kessel. The Betriebsstatus bit layout of the WPM3i (0x4e5e) differs from the Kessel one (0x0a20).
# - VORLAUFISTTEMP from the Kessel, the refrigerant pressures scaled by 10, more frequent reads; pump powers,
#   Verdichter Stillstand and Reglerdynamik are numbers (sensors in ttf07.yaml); no KUEHLEN_EINGESCHALTET (does not
#   react here, cooling: KUEHLEN_EIN); the HK1 room values of txx_base.yaml are internal (HK1 is the FEK or the ESP's
#   emulation here).
# - New template entities are named by their id like in the other device files (e.g. HKISTTEMP). For human readable German names, add names/ttf07_wpm3i_de.yaml as a package (choose before
#   the first install: renaming an entity later starts a new history in Home Assistant).
# - Additional sensors: power/energy split (heating, hot water, external heating circuit pump), COP, operating hours,
#   cooling settings. Sensors for registers that are not identified yet: ttf07_wpm3i_debug.yaml (optional package).
#
# NOTES
# - Heating control (section "Heating control"): if a FEK2 is installed, it controls heating (it sets the flow
#   setpoint) and the HK1 heating settings are locked here. Without a FEK2, select "Heizungssteuerung":
#     - "Wärmepumpe": the WPM3i controls heating itself (Eco/Komfort temperature, Steigung, Programmschalter).
#     - "FEK Emulation": the ESP registers as FEK2, sends the room values from Home Assistant and the flow setpoint
#       from its own heating curve. Without a FEK2 the WPM blocks cooling; the emulation unblocks the "Kühlen" menu.
# - core.yaml's way of sending room temperature/humidity (to HK1 every minute) is removed; the FEK emulation sends
#   them like the FEK2 does.
# - The external heating circuit pump has a constant power consumption, set $static_leistung_heizkreispumpe (in W,
#   0 if not applicable) in your device yaml.
# - HA Energy dashboard (>2025.12), add as "individual devices":
#     - Wärmepumpe:     Energie Summe / Leistung Summe
#     - Warmwasser:     EL_ENERGIEAUFNAHME_WW_SUMME_MWH / Leistung Warmwasserbereitung   (upstream: Wärmepumpe)
#     - Heizung:        EL_ENERGIEAUFNAHME_HEIZ_SUMME_MWH / Leistung Heizen             (upstream: Wärmepumpe)
#     - Heizkreispumpe: Energie ext. Heizkreispumpe / Leistung ext. Heizkreispumpe      (upstream: Heizung)
#
# ToDo / open issues
# - Kühlen: the settings are mapped, cooling itself is not tested yet.
# - naming: Is NHZ3 actually NHZ1_2?

#########################################
#                                       #
#   Substitutions                       #
#                                       #
#########################################
substitutions:
  espclient_can_id: "0x680"
  static_leistung_heizkreispumpe: "0"
  # ttf07_base.yaml / txx_base.yaml
  druck_kaeltekreis_scaler: "10.0"    # et_cent_val divides by 100, the panel shows raw/10 bar
  vorlaufisttemp_target: "Kessel"
  hk1_settings_write_lock: "id(heating_settings_locked)"

#########################################
#                                       #
#   ESPHome                             #
#                                       #
#########################################
esphome:
  on_boot:
    # Sommerbetrieb, Antilegionellen, Pumpenzyklen (Kessel, 0x0100 = EIN), Pufferbetrieb (Kessel, 1 = EIN) and the Heizprogramm of HK1 (7 days x 3 windows at
    # HK1 0x1410 + 0x10 * day + window; answered only while the WPM3i owns HK1, i.e. no FEK / emulation)
    - priority: -50
      then:
        - lambda: |-
            const auto flag = [](binary_sensor::BinarySensor *sensor) {
              return [sensor](const SimpleVariant &value) {
                const bool on = static_cast<std::int32_t>(value.get<float>()) != 0;
                if (!sensor->has_state() || sensor->state != on) sensor->publish_state(on);
              };
            };
            CallbackHandler::instance().addCallback({CanNode::Kessel, Property::kSOMMERBETRIEB}, flag(id(SOMMERBETRIEB)));
            CallbackHandler::instance().addCallback({CanNode::Kessel, Property::kANTILEGIONELLEN}, flag(id(ANTILEGIONELLEN)));
            CallbackHandler::instance().addCallback({CanNode::Kessel, Property::kPUMPENZYKLEN}, flag(id(PUMPENZYKLEN)));
            CallbackHandler::instance().addCallback({CanNode::Kessel, Property::kPUFFERBETRIEB}, flag(id(PUFFERBETRIEB)));
            for (std::size_t i = 0; i < 21; ++i) {
              const std::uint16_t addr = 0x1410 + 0x10 * (i / 3) + (i % 3);
              CallbackHandler::instance().addCallback({CanNode::HK1, Property(addr)}, [i](const SimpleVariant &value) {
                id(heiz_programm)[i] = static_cast<std::uint16_t>(static_cast<std::int32_t>(value.get<float>()));
                id(heiz_programm_valid) |= (1UL << i);
                const std::size_t day = i / 3;
                if (((id(heiz_programm_valid) >> (3 * day)) & 7UL) != 7UL) return;
                std::string text;
                for (std::size_t w = 0; w < 3; ++w) {
                  const std::uint16_t v = id(heiz_programm)[3 * day + w];
                  if (v & 0x8080) continue;
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%02u:%02u-%02u:%02u", (v >> 8) / 4U, 15U * ((v >> 8) % 4U),
                           (v & 0xff) / 4U, 15U * ((v & 0xff) % 4U));
                  if (!text.empty()) text += ", ";
                  text += buf;
                }
                if (text.empty()) text = "-";
                const std::array<template_::TemplateTextSensor *, 7> days{id(HEIZ_PROGRAMM_MO), id(HEIZ_PROGRAMM_DI),
                    id(HEIZ_PROGRAMM_MI), id(HEIZ_PROGRAMM_DO), id(HEIZ_PROGRAMM_FR), id(HEIZ_PROGRAMM_SA), id(HEIZ_PROGRAMM_SO)};
                if (days[day]->state != text) days[day]->publish_state(text);
              });
            }
    # Settings shown as text ("Aus" for 0x9000), Aufheizprogramm state, Ferienprogramm dates
    - priority: -50
      then:
        - lambda: |-
            const auto temp_or_aus = [](template_::TemplateTextSensor *sensor) {
              return [sensor](const SimpleVariant &value) {
                const auto raw = static_cast<std::uint16_t>(static_cast<std::int32_t>(value.get<float>()));  // float may be negative
                char buf[16];
                // 0x8000..0xEFFF can't be a temperature (< -409.6 °C): status codes. 0x9000 = AUS on the panel;
                // 0xA000 also seen for the same settings (meaning unknown)
                if (raw == 0x9000 || raw == 0xA000) snprintf(buf, sizeof(buf), "Aus");
                else if (raw >= 0x8000 && raw < 0xF000) snprintf(buf, sizeof(buf), "0x%04X", raw);
                else snprintf(buf, sizeof(buf), "%.1f °C", static_cast<std::int16_t>(raw) / 10.0f);
                ESP_LOGD("SETTING", "%s: raw 0x%04X -> %s", sensor->get_name().c_str(), raw, buf);
                if (sensor->state != buf) sensor->publish_state(buf);
              };
            };
            CallbackHandler::instance().addCallback({CanNode::Kessel, Property::kEINSATZGRENZE_HZG}, temp_or_aus(id(EINSATZGRENZE_HZG)));
            CallbackHandler::instance().addCallback({CanNode::Kessel, Property::kEINSATZGRENZE_WW}, temp_or_aus(id(EINSATZGRENZE_WW)));
            CallbackHandler::instance().addCallback({CanNode::Kessel, Property::kFESTWERTBETRIEB}, temp_or_aus(id(FESTWERTBETRIEB)));
            CallbackHandler::instance().addCallback({CanNode::Kessel, Property::kAUFHEIZPROGRAMM}, [](const SimpleVariant &value) {
              const bool on = value.get<float>() != 0.0f;
              if (!id(AUFHEIZPROGRAMM).has_state() || id(AUFHEIZPROGRAMM).state != on) id(AUFHEIZPROGRAMM).publish_state(on);
            });
            const std::array<Property, 6> ferien{Property::kFERIEN_BEGINN_TAG, Property::kFERIEN_BEGINN_MONAT,
                Property::kFERIEN_BEGINN_JAHR, Property::kFERIEN_ENDE_TAG, Property::kFERIEN_ENDE_MONAT,
                Property::kFERIEN_ENDE_JAHR};
            for (std::size_t i = 0; i < ferien.size(); ++i) {
              CallbackHandler::instance().addCallback({CanNode::Manager, ferien[i]}, [i](const SimpleVariant &value) {
                id(ferien_datum)[i] = static_cast<int>(value.get<float>());
                for (const int v : id(ferien_datum)) if (v < 0) return;
                const auto &d = id(ferien_datum);
                char buf[32];
                snprintf(buf, sizeof(buf), "%02d.%02d.%02d - %02d.%02d.%02d", d[0], d[1], d[2], d[3], d[4], d[5]);
                if (id(FERIENPROGRAMM).state != buf) id(FERIENPROGRAMM).publish_state(buf);
              });
            }
    # Warmwasserprogramm: register the 21 time windows (7 days x 3, Kessel 0x1710 + 0x10 * day + window) and publish
    # each day as text "06:00-08:00, 17:00-18:30" ("-" = no window) once all 3 windows of the day are known
    - priority: -50
      then:
        - lambda: |-
            for (std::size_t i = 0; i < 21; ++i) {
              const std::uint16_t addr = 0x1710 + 0x10 * (i / 3) + (i % 3);
              CallbackHandler::instance().addCallback({CanNode::Kessel, Property(addr)}, [i](const SimpleVariant &value) {
                id(ww_programm)[i] = static_cast<std::uint16_t>(static_cast<std::int32_t>(value.get<float>()));
                id(ww_programm_valid) |= (1UL << i);
                id(ww_modus_pending) &= ~(1UL << i);
                id(ww_programm_update_modus)();
                const std::size_t day = i / 3;
                if (((id(ww_programm_valid) >> (3 * day)) & 7UL) != 7UL) return;
                std::string text;
                for (std::size_t w = 0; w < 3; ++w) {
                  const std::uint16_t v = id(ww_programm)[3 * day + w];
                  if (v & 0x8080) continue;  // empty window (--:--)
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%02u:%02u-%02u:%02u", (v >> 8) / 4U, 15U * ((v >> 8) % 4U),
                           (v & 0xff) / 4U, 15U * ((v & 0xff) % 4U));
                  if (!text.empty()) text += ", ";
                  text += buf;
                }
                if (text.empty()) text = "-";
                const std::array<template_::TemplateText *, 7> days{id(WW_PROGRAMM_MO), id(WW_PROGRAMM_DI),
                    id(WW_PROGRAMM_MI), id(WW_PROGRAMM_DO), id(WW_PROGRAMM_FR), id(WW_PROGRAMM_SA), id(WW_PROGRAMM_SO)};
                if (days[day]->state != text) days[day]->publish_state(text);
              });
            }
    # Warmwasserprogramm: first read 90 s after boot
    - priority: -200
      then:
        - delay: 90s
        - script.execute: ww_programm_lesen
        - delay: 10s
        - lambda: |-
            queueRequest(CanNode::Kessel, Property::kEINSATZGRENZE_HZG);
            queueRequest(CanNode::Kessel, Property::kEINSATZGRENZE_WW);
            queueRequest(CanNode::Kessel, Property::kFESTWERTBETRIEB);
            queueRequest(CanNode::Kessel, Property::kAUFHEIZPROGRAMM);
            for (const auto &p : {Property::kFERIEN_BEGINN_TAG, Property::kFERIEN_BEGINN_MONAT, Property::kFERIEN_BEGINN_JAHR,
                                  Property::kFERIEN_ENDE_TAG, Property::kFERIEN_ENDE_MONAT, Property::kFERIEN_ENDE_JAHR}) {
              queueRequest(CanNode::Manager, p);
            }
    # Error list: first read 2 min after boot (CAN and queues are running by then)
    - priority: -200
      then:
        - delay: 2min
        - script.execute: fehlerliste_lesen
    - priority: -50
      then:
        - lambda: |-
            // Error list: the Manager answers a request of 0x0B9A to the control panel (0x100); the ESP listens. Also
            // filled when someone opens the list on the panel.
            CallbackHandler::instance().addCallback({CanNode::Manager, Property::kFEHLERLISTE_INDEX}, [](const SimpleVariant &value) {
              id(fehlerliste_index) = static_cast<int>(value.get<float>());
            });
            const auto fehlerliste_feld = [](std::size_t field) {
              return [field](const SimpleVariant &value) {
                const int index = id(fehlerliste_index);
                if (index >= 0 && index < static_cast<int>(id(fehlerliste).size())) {
                  id(fehlerliste)[index][field] = static_cast<std::int16_t>(value.get<float>());
                }
              };
            };
            CallbackHandler::instance().addCallback({CanNode::Manager, Property::kFEHLERLISTE_CODE}, fehlerliste_feld(0));
            CallbackHandler::instance().addCallback({CanNode::Manager, Property::kFEHLERLISTE_MINUTE}, fehlerliste_feld(1));
            CallbackHandler::instance().addCallback({CanNode::Manager, Property::kFEHLERLISTE_STUNDE}, fehlerliste_feld(2));
            CallbackHandler::instance().addCallback({CanNode::Manager, Property::kFEHLERLISTE_TAG}, fehlerliste_feld(3));
            CallbackHandler::instance().addCallback({CanNode::Manager, Property::kFEHLERLISTE_MONAT}, fehlerliste_feld(4));
            CallbackHandler::instance().addCallback({CanNode::Manager, Property::kFEHLERLISTE_JAHR}, fehlerliste_feld(5));
            // Current error as text; a new error refreshes the error list
            CallbackHandler::instance().addCallback({CanNode::Manager, Property::kFEHLERNUMMER_WPM}, [](const SimpleVariant &value) {
              static int last = -1;
              const int code = static_cast<int>(value.get<float>());
              std::string text = "kein Fehler";
              if (code != 0) {
                const auto it = id(fehler_texte).find(code);
                text = (it != id(fehler_texte).end() ? it->second : std::string("unbekannt")) + " (" + to_string(code) + ")";
              }
              if (id(FEHLER_AKTUELL).state != text) {
                id(FEHLER_AKTUELL).publish_state(text);
              }
              if (last != -1 && code != last && code != 0) {
                id(fehlerliste_lesen).execute();
              }
              last = code;
            });
            CallbackHandler::instance().addCallback({CanNode::Manager,Property::kBETRIEBS_STATUS_WPM},[](const SimpleVariant& value){
              const std::bitset<16U> status_bits{static_cast<std::uint16_t>(value.get<float>())};

              // for debugging (remove after Sommerbetrieb and Kühlbetrieb were tested)
              id(DEBUG_BETRIEB).publish_state(status_bits.to_string());

              id(HEIZKREISPUMPE).publish_state(status_bits.test(0U));
              id(MISCHER_PUMPE).publish_state(status_bits.test(1U));
              id(MISCHER_AUF).publish_state(status_bits.test(2U));
              id(MISCHER_ZU).publish_state(status_bits.test(3U));
              id(NHZ1).publish_state(status_bits.test(7U) && !status_bits.test(5U) && status_bits.test(4U));  // 0x0090 [7_4] 1001
              id(NHZ2).publish_state(status_bits.test(7U) && status_bits.test(5U) && !status_bits.test(4U));  // 0x00A0 [7_4] 1010
              id(NHZ3).publish_state(status_bits.test(7U) && status_bits.test(5U) && status_bits.test(4U));   // 0x00B0 [7_4] 1011
              id(HEIZBETRIEB).publish_state(!status_bits.test(13U) && !status_bits.test(9U) && status_bits.test(7U));  // 0x0080, not in KUEHLBETRIEB
              id(QUELLENPUMPE).publish_state(status_bits.test(6U));                         // 0x0040
              id(PUFFERLADEPUMPE).publish_state(status_bits.test(7U));                      // 0x0080
              id(ENTLEERUNG_HYD).publish_state(status_bits.test(9U));                       // 0x0200
              id(WARMWASSERBEREITUNG).publish_state(status_bits.test(9U) && status_bits.test(7U));  // 0x0280
              id(KUEHLBETRIEB).publish_state(status_bits.test(13U));                        // 0x2000
              id(VERDICHTER).publish_state(status_bits.test(14U));                          // 0x4000
            });

            // Heating control: the WPM3i checks the node 0x301 every 8 min (system message, ANMELDUNG = 0x0800).
            // A FEK answers with a system response (0x0100); as long as it does, the FEK owns HK1.
            CallbackHandler::instance().addCallback({CanNode::HK1,Property::kANMELDUNG},[](const SimpleVariant& value){
              const auto raw = static_cast<std::uint16_t>(static_cast<std::int32_t>(value.get<float>()));  // float may be negative
              // ANMELDUNG on 0x301: 0x0800 = the WPM3i's presence check, 0x0900 = a FEK registers, 0x0100 = a FEK answers
              const char* what = raw == 0x0800 ? "presence check" : raw == 0x0900 ? "FEK registration" :
                                 raw == 0x0100 ? "FEK answer to the presence check" : "unknown";
              ESP_LOGI("FEK", "ANMELDUNG 0x%04x on 0x301 (%s), emulation %s", raw, what, id(fek_registered) ? "registered" : "off");
              if (raw == 0x0800 && id(fek_registered)) {
                id(fek_send)(0x301, 7, 0xfd, 0x0100);  // system response: "present"
              }
            });

            // FEK detection: HK1 reports the WPM3i's software version (same as the Manager) unless a FEK owns HK1.
            CallbackHandler::instance().addCallback({CanNode::Manager,Property::kFET_SOFTWARE},[](const SimpleVariant& value){
              id(sw_version_manager) = static_cast<int>(value.get<float>());
              id(software_publish)();
            });
            CallbackHandler::instance().addCallback({CanNode::Manager,Property::kFET_SOFTWARESTAND},[](const SimpleVariant& value){
              id(sw_revision_manager) = static_cast<int>(value.get<float>());
              id(software_publish)();
            });
            CallbackHandler::instance().addCallback({CanNode::HK1,Property::kFET_SOFTWARESTAND},[](const SimpleVariant& value){
              id(sw_revision_hk1) = static_cast<int>(value.get<float>());
              id(software_publish)();
            });
            CallbackHandler::instance().addCallback({CanNode::HK1,Property::kFET_SOFTWARE},[](const SimpleVariant& value){
              const int hk1 = static_cast<int>(value.get<float>());
              id(sw_version_hk1) = hk1;
              id(software_publish)();
              const int manager = id(sw_version_manager);
              if (manager < 0) {
                return;  // compare at the next check
              }
              if (hk1 == manager) {
                if (id(fek_state) != 1) {
                  ESP_LOGI("FEK", "No FEK installed: HK1 is the WPM3i's (software %d)", hk1);
                }
                id(fek_state) = 1;
                if (id(fek_registered)) {
                  // the WPM3i answers for HK1 again, so the emulation lost its registration (e.g. WPM3i restart)
                  ESP_LOGW("FEK", "Emulation registration lost, registering again");
                  id(fek_registered) = false;
                }
              } else {
                id(fek_seen)("HK1 software differs from the WPM3i's");
              }
              id(heating_control_update).execute();
            });
    - priority: -100
      then:
        - delay: 250ms
        - lambda: |-
            queueRequest(CanNode::Manager, Property::kBETRIEBS_STATUS_WPM);
            queueRequest(CanNode::Kessel, Property::kEINPHASIGER_BETRIEB);

#########################################
#                                       #
#   CAN Bus                             #
#                                       #
#########################################
canbus:
  - id: !extend wp_can
    bit_rate: $can_bus_bit_rate
    on_frame:
      # CAN nodes on the bus: count the frames per sender (the ESP does not receive its own frames)
      - can_id: 0
        can_id_mask: 0
        then:
          - lambda: |-
              id(can_frames)[static_cast<std::uint16_t>(can_id)]++;
      # Heating control: detect a real FEK and, while emulating, answer what is addressed to the FEK (node 0x301)
      # like the real FEK does. The ESP does not receive its own frames.
      - can_id: 0
        can_id_mask: 0
        then:
          - lambda: |-
              if (x.size() < 7) {
                return;
              }
              const std::uint16_t node = ((x[0] & 0xf0) << 3) | (x[1] & 0x7f);
              const std::uint8_t type = x[0] & 0x0f;
              // Signs of a real FEK, sent with CAN ID 0x301: registration (system 0x00fd = 0x0900), answer to the
              // WPM3i's presence check (system response 0x00fd), room temperature written to 0x601.
              if (can_id == 0x301) {
                if (type == 6 && node == 0x301 && x[2] == 0xfd && x[3] == 0x09) {
                  id(fek_seen)("registration");
                } else if (type == 7 && node == 0x301 && x[2] == 0xfd) {
                  id(fek_seen)("answer to the presence check");
                } else if (type == 0 && node == 0x601 && x[2] == 0x11) {
                  id(fek_seen)("room temperature to 0x601");
                }
              }
              // HK1 heat demand: 0x601 writes 0x0052 to HK1 (0x301), 0x0100 = demand. Not dispatched by core.yaml
              // (0x601 is no CanNode), so decoded here; short form [.., 0x52, hi, lo], long form [.., 0xfa, 0x00, 0x52, hi, lo].
              if (can_id == 0x601 && type == 0 && node == 0x301) {
                const bool long_form = x[2] == 0xfa;
                const std::uint16_t addr = long_form ? ((x[3] << 8) | x[4]) : x[2];
                const std::uint16_t val = long_form ? ((x[5] << 8) | x[6]) : ((x[3] << 8) | x[4]);
                if (addr == 0x0052) {
                  const bool on = val != 0;
                  if (!id(HEIZ_ANFORDERUNG_HK1).has_state() || id(HEIZ_ANFORDERUNG_HK1).state != on)
                    id(HEIZ_ANFORDERUNG_HK1).publish_state(on);
                }
              }
              if (!id(fek_registered) || node != 0x301) {
                return;
              }
              // Reads addressed to HK1 (= the ESP while emulating): answer like the real FEK did, so the reader does
              // not run into a timeout. The control panel (0x100) reads VORLAUFSOLLTEMP in short form and retries
              // every ~6 s without an answer (spinning wheel on the display). The answer goes to the
              // reader in the form of the read (short form: [.., property, value, 0, 0], long form: [.., 0xfa, ...]).
              if (type == 1) {
                const bool long_form = x[2] == 0xfa;
                const std::uint16_t property = long_form ? ((x[3] << 8) | x[4]) : x[2];
                const std::uint16_t reader = can_id & 0x7ff;
                const bool eco = id(FEK_BETRIEBSART).active_index().value_or(0) == 1;
                const auto dec = [](float v) -> int { return std::isnan(v) ? -1 : static_cast<int>(lroundf(v * 10.0f)); };
                int value = -1;
                switch (property) {
                  case 0x0199: value = 0x01a0; break;                              // FET_SOFTWARE (FEK2: 416)
                  case 0x019a: value = 0x0003; break;                              // FET_SOFTWARESTAND (FEK2: 3)
                  case 0x0004: value = dec(id(FEK_VORLAUF_SOLL).state); break;     // VORLAUFSOLLTEMP, as last sent
                  case 0x0005: value = dec(id(FEK_KOMF_TEMP).state); break;        // KOMF_TEMP
                  case 0x0008: value = dec(id(FEK_ECO_TEMP).state); break;         // ECO_TEMP
                  case 0x0012: value = dec(eco ? id(FEK_ECO_TEMP).state : id(FEK_KOMF_TEMP).state); break;  // VERSTELLTE_RAUMSOLLTEMP
                  case 0x010e:                                                     // STEIGUNG_HK1 (cent)
                    if (!std::isnan(id(FEK_STEIGUNG).state)) value = static_cast<int>(lroundf(id(FEK_STEIGUNG).state * 100.0f));
                    break;
                  case 0x010f: value = 0x0200; break;                              // RAUMEINFLUSS 2 (little endian), as sent to 0x601
                  default: break;
                }
                if (value < 0) {
                  ESP_LOGD("FEK", "Read of 0x%04x from 0x%03x: not answered (unknown to the emulation)", property, reader);
                  return;
                }
                if (long_form && property < 0x100) {
                  // fek_send would pick the short form for this property; answer in the long form of the read
                  const auto v = static_cast<std::uint16_t>(value);
                  id(fek_tx_queue).push_back({static_cast<std::uint8_t>(((reader >> 3) & 0xf0) | 2),
                                              static_cast<std::uint8_t>(reader & 0x7f), 0xfa,
                                              static_cast<std::uint8_t>(property >> 8), static_cast<std::uint8_t>(property),
                                              static_cast<std::uint8_t>(v >> 8), static_cast<std::uint8_t>(v)});
                } else {
                  id(fek_send)(reader, 2, property, static_cast<std::uint16_t>(value));
                }
                ESP_LOGD("FEK", "Read of 0x%04x from 0x%03x: answered %d", property, reader, value);
                return;
              }
              // System message 0x00fe from 0x601: answer to 0x601 and to the Kessel (system response)
              if (type == 6 && can_id == 0x601 && x[2] == 0xfe) {
                id(fek_send)(0x601, 7, 0xfe, 0x0100);
                id(fek_send)(0x180, 7, 0xfe, 0x0100);
              }

#########################################
#                                       #
#   Global variables                    #
#                                       #
#########################################
globals:
  # Heizprogramm HK1: raw time windows (7 days x 3) and which of them have been read (bit per window)
  - id: heiz_programm
    type: std::array<std::uint16_t, 21>
  - id: heiz_programm_valid
    type: std::uint32_t
    initial_value: '0'
  # Ferienprogramm: start day, month, year, end day, month, year (-1 = not read yet)
  - id: ferien_datum
    type: std::array<int, 6>
    initial_value: '{-1, -1, -1, -1, -1, -1}'
  # Warmwasserprogramm: raw time windows (7 days x 3) and which of them have been read since boot (bit per window)
  - id: ww_programm
    type: std::array<std::uint16_t, 21>
  - id: ww_programm_valid
    type: std::uint32_t
    initial_value: '0'
  # Windows not read back yet since "Warmwasser Modus" was switched (bit per window); until all are back, the mode
  # is not evaluated, so a half-updated program does not show as "Programm"
  - id: ww_modus_pending
    type: std::uint32_t
    initial_value: '0'
  # Publishes "Warmwasser Modus" from ww_programm once all 21 windows are known (see the select WW_MODUS)
  - id: ww_programm_update_modus
    type: std::function<void()>
    initial_value: |-
      []() {
        if (id(ww_programm_valid) != (1UL << 21) - 1 || id(ww_modus_pending) != 0) return;
        bool komfort = true, eco = true;
        for (std::size_t i = 0; i < 21; ++i) {
          const std::uint16_t v = id(ww_programm)[i];
          const std::uint16_t komfort_v = (i % 3 == 0) ? 0x0060 : 0x8080;
          if (v != komfort_v) komfort = false;
          if (!(v & 0x8080)) eco = false;
        }
        const char *modus = komfort ? "Komfort" : (eco ? "Eco" : "Programm");
        if (!id(WW_MODUS).has_state() || id(WW_MODUS).current_option() != std::string(modus)) {
          id(WW_MODUS).publish_state(modus);
        }
      }
  # CAN nodes on the bus (diagnostic): frames per sender CAN ID in the current minute, the counts of the last 60
  # minutes (sliding window for the hourly rate), and for unknown senders the time they were last seen (epoch
  # seconds). Published every minute by the interval "CAN nodes".
  - id: can_frames
    type: std::map<std::uint16_t, std::uint32_t>
  - id: can_frames_window      # [minute][sender]: the 7 known senders in the order of the interval, then unknown
    type: std::array<std::array<std::uint16_t, 8>, 60>
  - id: can_frames_window_pos  # next slot to write
    type: std::uint8_t
    initial_value: '0'
  - id: can_frames_window_fill # minutes recorded so far (up to 60)
    type: std::uint8_t
    initial_value: '0'
  - id: can_unknown_last_seen
    type: std::map<std::uint16_t, std::uint32_t>
  # Error list (see script fehlerliste_lesen): the 5 newest entries [index][code, minute, hour, day, month, year],
  # the index of the block being received, and the texts of the known WPM3i error codes
  - id: fehlerliste
    type: std::array<std::array<std::int16_t, 6>, 5>
  - id: fehlerliste_index
    type: int
    initial_value: '-1'
  - id: fehler_texte
    type: std::map<int, std::string>
    initial_value: '{{18, "Hochdruck"}, {21, "Keine Leistung"}, {22, "Niederdruck"}, {130, "Fühlerbruch E 130"}, {8036, "TO P SOL MFG"}, {8039, "TO PU SOL MFG"}, {8040, "TO VENTIL MFG"}, {8041, "TO DHC MFG"}}'
  # Heating control (see section "Heating control")
  - id: fek_state             # 0 = checking, 1 = no FEK (HK1 is the WPM3i's), 2 = a real FEK is installed
    type: int
    initial_value: '0'
  - id: fek_last_seen         # millis() of the last sign of a real FEK
    type: uint32_t
    initial_value: '0'
  - id: sw_version_manager    # FET_SOFTWARE of the WPM3i, -1 = not read yet
    type: int
    initial_value: '-1'
  - id: sw_revision_manager   # FET_SOFTWARESTAND of the WPM3i, -1 = not read yet
    type: int
    initial_value: '-1'
  - id: sw_version_hk1        # FET_SOFTWARE of HK1 (the WPM3i's or a FEK's), -1 = not read yet
    type: int
    initial_value: '-1'
  - id: sw_revision_hk1       # FET_SOFTWARESTAND of HK1, -1 = not read yet
    type: int
    initial_value: '-1'
  - id: software_publish      # publishes the diagnostic sensors "Software WPM3i" and "Software HK1"
    type: std::function<void()>
    initial_value: |-
      []() {
        const auto version = [](int v, int r) -> std::string {
          char buf[32];
          if (r >= 0) snprintf(buf, sizeof(buf), "%d.%02d", v, r); else snprintf(buf, sizeof(buf), "%d", v);
          return buf;
        };
        if (id(sw_version_manager) >= 0) {
          const auto wpm3i = version(id(sw_version_manager), id(sw_revision_manager));
          if (id(SOFTWARE_WPM3I).state != wpm3i) id(SOFTWARE_WPM3I).publish_state(wpm3i);
        }
        std::string hk1;
        if (id(fek_registered)) {
          hk1 = "416.03 (Emulation)";  // the ESP is HK1 and answers like the FEK2
        } else if (id(sw_version_hk1) >= 0) {
          hk1 = version(id(sw_version_hk1), id(sw_revision_hk1)) +
                (id(sw_version_hk1) == id(sw_version_manager) ? " (WPM3i)" : " (FEK)");
        }
        if (!hk1.empty() && id(SOFTWARE_HK1).state != hk1) id(SOFTWARE_HK1).publish_state(hk1);
      }
  - id: fek_registered        # the ESP is registered as FEK (emulation active)
    type: bool
    initial_value: 'false'
  - id: heating_settings_locked  # HK1 heating settings are not written (FEK installed, emulation active, checking)
    type: bool
    initial_value: 'true'
  - id: fek_tx_queue          # frames to send as 0x301, sent one every 30 ms
    type: std::vector<std::vector<std::uint8_t>>
  - id: fek_send
    type: std::function<void(std::uint16_t, std::uint8_t, std::uint16_t, std::uint16_t)>
    initial_value: |-
      [](std::uint16_t node, std::uint8_t type, std::uint16_t property, std::uint16_t value) {
        // Frame like the FEK sends it (CAN ID 0x301). ID bytes = addressed node + message type
        // (0 write, 1 read, 2 response, 6 system, 7 system response).
        // Short form for properties < 0x100: [id0, id1, property, value_hi, value_lo, 0, 0]
        // Long form otherwise:               [id0, id1, 0xfa, property_hi, property_lo, value_hi, value_lo]
        auto b = [](unsigned v) { return static_cast<std::uint8_t>(v & 0xff); };
        const auto id0 = b(((node >> 3) & 0xf0) | (type & 0x0f));
        const auto id1 = b(node & 0x7f);
        std::vector<std::uint8_t> data;
        if (property < 0x100) {
          data = {id0, id1, b(property), b(value >> 8), b(value), 0x00, 0x00};
        } else {
          data = {id0, id1, 0xfa, b(property >> 8), b(property), b(value >> 8), b(value)};
        }
        id(fek_tx_queue).push_back(data);
      }
  - id: fek_seen
    type: std::function<void(const char*)>
    initial_value: |-
      [](const char* reason) {
        if (id(fek_state) != 2) {
          ESP_LOGW("FEK", "Real FEK detected (%s): it controls heating, HK1 settings locked", reason);
        }
        if (id(fek_registered)) {
          ESP_LOGE("FEK", "Real FEK detected while emulating: stopping the emulation");
          id(fek_registered) = false;
        }
        id(fek_state) = 2;
        id(fek_last_seen) = millis();
      }
  - id: fek_flow_setpoint
    type: std::function<float()>
    initial_value: |-
      []() -> float {
        // Heating curve, fitted to the WPM3i's own flow setpoint (146 values over a week, Eco and Komfort,
        // rms 0.06 K): Vorlauf = Raumsoll + Steigung * (Raumsoll - Aussen) + Offset (Offset 0.23 with Steigung 0.26).
        // The real FEK's values (21.5 °C, Steigung 0.24, 7.9 °C outside -> 25.0 °C) fit the same curve.
        // Room influence (own definition, K flow per K room deviation) uses the house temperature from HA.
        const float outside = id(AUSSENTEMP).state;
        if (std::isnan(outside) || outside < -30.0f || outside > 40.0f) {
          return NAN;
        }
        const bool eco = id(FEK_BETRIEBSART).active_index().value_or(0) == 1;
        const float room_set = eco ? id(FEK_ECO_TEMP).state : id(FEK_KOMF_TEMP).state;
        float flow = room_set + id(FEK_STEIGUNG).state * (room_set - outside) + id(FEK_OFFSET).state;
        const float room = id(fek_ha_temperature).state;
        if (!std::isnan(room) && room > 5.0f && room < 35.0f) {
          flow += std::clamp(id(FEK_RAUMEINFLUSS).state * (room_set - room), -5.0f, 5.0f);
        }
        return std::clamp(flow, id(FEK_VORLAUF_MIN).state, id(FEK_VORLAUF_MAX).state);
      }

#########################################
#                                       #
#   Heating control                     #
#                                       #
#########################################
# FEK detection: every minute the ESP reads FET_SOFTWARE (0x0199) from HK1 and the Manager. Without a FEK, the WPM3i
# answers for HK1 with its own version (391); a FEK answers with its own (FEK2: 416). Registration, answers to the
# presence check and room values from 0x301 also count as a FEK. Without signs for 10 min the check starts again.
#
# "Heizungssteuerung" (only without a FEK):
#   - "Wärmepumpe": the WPM3i controls heating; the HK1 settings (Komfort/Eco, Steigung, Raumeinfluss) are writable.
#   - "FEK Emulation": the ESP registers as FEK on node 0x301 like the FEK2 (sends with CAN ID 0x301), answers the
#     presence check, the control panel's identification and 0x601's system messages, sends the room values from HA
#     every minute and the flow setpoint from its heating curve every 3 min (to the Kessel 0x0002 and to 0x601 0x0004,
#     plus the FEK2's other periodic values). Without a valid outdoor temperature, or when a real FEK appears, the ESP
#     stops answering, and the WPM3i takes HK1 back at its next check (<= 8 min).
select:
  - platform: template
    name: "Heizungssteuerung"
    id: HEIZUNGSSTEUERUNG
    icon: "mdi:home-thermometer"
    entity_category: config
    options: ["Wärmepumpe", "FEK Emulation"]
    initial_option: "Wärmepumpe"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: heating_control_update

  - platform: template
    name: "FEK Emulation Betriebsart"
    id: FEK_BETRIEBSART
    icon: "mdi:sun-thermometer"
    options: ["Komfort", "Eco"]
    initial_option: "Komfort"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: fek_send_setpoint  # like the FEK2: send the new phase and setpoint at once

  # Hot water Komfort/Eco. The WPM3i heats hot water to WW Komfort inside the Warmwasserprogramm's windows and to WW
  # Eco outside them; the Programmschalter does not change that (test 2026-11-18). So:
  #   Komfort  = window 00:00-24:00 on every day (Mo-So group 0x17A0, the WPM3i copies it to all days)
  #   Eco      = no window on any day
  #   Programm = any other program (e.g. set on the control panel); shown only, cannot be selected here
  # The state follows the program read back from the heat pump (ww_programm_update_modus).
  - platform: template
    name: "Warmwasser Modus"
    id: WW_MODUS
    icon: "mdi:water-boiler"
    options: ["Komfort", "Eco", "Programm"]
    optimistic: false
    set_action:
      - lambda: |-
          if (x == "Programm") {
            ESP_LOGW("WW", "Warmwasser Modus: 'Programm' cannot be selected, set the program on the panel or per day");
            id(ww_programm_update_modus)();
            return;
          }
          const bool komfort = x == "Komfort";
          const std::array<std::uint16_t, 3> raw{static_cast<std::uint16_t>(komfort ? 0x0060 : 0x8080), 0x8080, 0x8080};
          ESP_LOGI("WW", "Warmwasser Modus -> %s: Warmwasserprogramm Mo-So window 1 = 0x%04x", x.c_str(), raw[0]);
          for (std::size_t w = 0; w < 3; ++w) {
            queueTransmission(CanNode::Kessel, Property(static_cast<std::uint16_t>(0x17A0 + w)), raw[w]);
          }
          id(ww_modus_pending) = (1UL << 21) - 1;  // evaluate again once all windows are read back
          id(WW_MODUS).publish_state(x);  // optimistic; corrected by the read back
      - delay: 5s
      - script.execute: ww_programm_lesen

# Parameters of the emulated FEK (defaults: the FEK2's own settings, offset from the fit above)
number:
  - id: !extend STEIGUNG_HK1
    mode: box
