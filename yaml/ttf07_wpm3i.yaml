#########################################
#                                       #
#   Sensors                             #
#                                       #
#########################################
sensor:
  # Base entities (ttf07.yaml / txx_base.yaml) adapted to the TTF07 C with WPM3i
  - id: !extend AUSSENTEMP
    update_interval: $interval_medium
  - id: !extend SPEICHERSOLLTEMP
    update_interval: $interval_medium
  - id: !extend VORLAUFSOLLTEMP
    update_interval: $interval_medium
  - id: !extend HKISTTEMP
    update_interval: $interval_medium
  - id: !extend HKSOLLTEMP
    update_interval: $interval_medium
  - id: !extend PUFFERISTTEMP
    update_interval: $interval_medium
  - id: !extend PUFFERSOLLTEMP
    update_interval: $interval_medium
  - id: !extend QUELLE_IST
    update_interval: $interval_medium
  - id: !extend QUELLENTEMP_MIN
    update_interval: $interval_medium
  - id: !extend HEISSGAS_TEMP
    update_interval: $interval_medium
  - id: !extend DRUCK_HEIZKREIS
    accuracy_decimals: 2
  - id: !extend QUELLENDRUCK
    accuracy_decimals: 2
  - id: !extend VOLUMENSTROM
    accuracy_decimals: 2
  # Energy totals: device class energy (HA Energy dashboard)
  - id: !extend EL_ENERGIEAUFNAHME_WW_SUMME_MWH
    icon: "mdi:fire"
    device_class: energy
  - id: !extend EL_ENERGIEAUFNAHME_HEIZ_SUMME_MWH
    icon: "mdi:fire"
    device_class: energy
  - id: !extend WAERMEERTRAG_WW_SUMME_MWH
    device_class: energy
  - id: !extend WAERMEERTRAG_HEIZ_SUMME_MWH
    device_class: energy
  # Room values of HK1: on this heat pump HK1 is the FEK (or the ESP's emulation); see FEK_RAUMTEMPERATUR_HK1,
  # FEK_RAUMFEUCHTE and RAUM*_WPM instead
  - id: !extend RAUMISTTEMP
    internal: true
    update_interval: never
  - id: !extend VERSTELLTE_RAUMSOLLTEMP
    internal: true
    update_interval: never
  - id: !extend RAUMFEUCHTE
    internal: true
    update_interval: never

  # CAN nodes on the bus: frames per hour per sender CAN ID, last 60 minutes (0 = node silent); see interval "CAN nodes"
  - platform: template
    name: "CAN Kessel 0x180 Frames"
    id: CAN_RATE_KESSEL
    unit_of_measurement: "1/h"
    icon: "mdi:lan-connect"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "CAN HK1 0x301 Frames"
    id: CAN_RATE_HK1
    unit_of_measurement: "1/h"
    icon: "mdi:lan-connect"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "CAN Manager 0x480 Frames"
    id: CAN_RATE_MANAGER
    unit_of_measurement: "1/h"
    icon: "mdi:lan-connect"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "CAN MFG 0x700 Frames"
    id: CAN_RATE_MFG
    unit_of_measurement: "1/h"
    icon: "mdi:lan-connect"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "CAN Bedienteil 0x100 Frames"
    id: CAN_RATE_BEDIENTEIL
    unit_of_measurement: "1/h"
    icon: "mdi:lan-connect"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "CAN 0x601 Frames"
    id: CAN_RATE_0X601
    unit_of_measurement: "1/h"
    icon: "mdi:lan-connect"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "CAN 0x680 Frames"
    id: CAN_RATE_0X680
    unit_of_measurement: "1/h"
    icon: "mdi:lan-connect"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "CAN unbekannt Frames"
    id: CAN_RATE_UNKNOWN
    unit_of_measurement: "1/h"
    icon: "mdi:lan-connect"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
  # Do not send room temperature and humidity from Home Assistant to HK1 like core.yaml does (see notes above).
  - id: !remove ha_temperature_sensor
  - id: !remove ha_humidity_sensor

  # Room values for the FEK emulation (and its heating curve)
  - platform: homeassistant
    id: fek_ha_temperature
    entity_id: $entity_room_temperature
    internal: true
  - platform: homeassistant
    id: fek_ha_humidity
    entity_id: $entity_humidity
    internal: true

  # Flow setpoint computed by the FEK emulation (published while it is active)
  - platform: template
    name: "FEK Emulation Vorlauf Soll"
    id: FEK_VORLAUF_SOLL
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  # trigger recalculation of LEISTUNG_*, when the compressor power changes
  - id: !extend LEISTUNG_VERDICHTER
    on_value:
      then:
        - component.update: LEISTUNG_HEIZEN
        - component.update: LEISTUNG_WARMWASSERBEREITUNG
        - component.update: LEISTUNG_SUMME

  - platform: template
    name: "Leistung ext. Heizkreispumpe"
    id: LEISTUNG_EXT_HEIZKREISPUMPE
    update_interval: never
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    lambda: |-
      return id(HEIZKREISPUMPE).state ? $static_leistung_heizkreispumpe : 0;

  - platform: integration
    name: "Energie ext. Heizkreispumpe"
    id: ENERGIE_EXT_HEIZKREISPUMPE
    sensor: LEISTUNG_EXT_HEIZKREISPUMPE
    time_unit: h
    restore: true  # keep the energy across reboots
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # corresponding energy is provided by EL_ENERGIEAUFNAHME_HEIZ_SUMME_MWH (which has a better accuracy)
  - platform: template
    name: "Leistung Heizen"
    id: LEISTUNG_HEIZEN
    update_interval: never
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    # Heizbetrieb means that the Verdichter is running. It can be either Warmwasser or Heizen.
    lambda: |-
      return id(LEISTUNG_EXT_HEIZKREISPUMPE).state + ((id(HEIZBETRIEB).state && !id(WARMWASSERBEREITUNG).state) ? id(LEISTUNG_VERDICHTER).state : 0);

  # corresponding energy is provided by EL_ENERGIEAUFNAHME_WW_SUMME_MWH
  - platform: template
    name: "Leistung Warmwasserbereitung"
    id: LEISTUNG_WARMWASSERBEREITUNG
    update_interval: never
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    lambda: |-
      return id(WARMWASSERBEREITUNG).state ? id(LEISTUNG_VERDICHTER).state : 0;

  - platform: template
    name: "Leistung Summe"
    id: LEISTUNG_SUMME
    update_interval: never
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    lambda: |-
      return id(LEISTUNG_HEIZEN).state + id(LEISTUNG_WARMWASSERBEREITUNG).state;

  - platform: integration
    name: "Leistung Summe integrated"
    id: ENERGIE_SUNMME_INTEGRATED
    sensor: LEISTUNG_SUMME
    time_unit: h
    restore: true  # keep the energy across reboots
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # Total electrical energy of the heat pump in kWh: (estimated) ext. Heizkreispumpe + EL_ENERGIEAUFNAHME_HEIZ_SUMME_MWH and
  # EL_ENERGIEAUFNAHME_WW_SUMME_MWH (MWh, converted to kWh)
  - platform: template
    name: "Energie Summe kWh"
    id: ENERGIE_SUMME_KWH
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    lambda: |-
      if (!id(EL_ENERGIEAUFNAHME_HEIZ_SUMME_MWH).has_state() || !id(EL_ENERGIEAUFNAHME_WW_SUMME_MWH).has_state()) {
        return {};
      }
      const float ext = id(ENERGIE_EXT_HEIZKREISPUMPE).has_state() ? id(ENERGIE_EXT_HEIZKREISPUMPE).state : 0.0f;
      return ext + 1000.0f * (id(EL_ENERGIEAUFNAHME_HEIZ_SUMME_MWH).state + id(EL_ENERGIEAUFNAHME_WW_SUMME_MWH).state);

  - platform: template
    name: "Heizkreis Spreizung"
    id: HEIZKREIS_SPREIZUNG
    icon: "mdi:swap-vertical"
    state_class: measurement
    accuracy_decimals: 1
    unit_of_measurement: "°C"
    lambda: |-
      return (id(VORLAUFISTTEMP).state - id(RUECKLAUFISTTEMP).state);

#########################################
#                                       #
#   Texts                               #
#                                       #
#########################################

# Warmwasserprogramm (Einstellungen > Programme on the control panel), one text per day: "06:00-08:00, 17:00-18:30"
# (at most 3 windows, 15-min steps; "-" = no window). Changing a day in HA writes it to the heat pump.
