script:
  # Warmwasserprogramm: read all 21 time windows from the Kessel
  - id: ww_programm_lesen
    mode: single
    then:
      - lambda: |-
          for (std::size_t i = 0; i < 21; ++i) {
            queueRequest(CanNode::Kessel, Property(static_cast<std::uint16_t>(0x1710 + 0x10 * (i / 3) + (i % 3))));
          }
  # Warmwasserprogramm: write one day from HA (text "06:00-08:00, 17:00-18:30", up to 3 windows in 15-min steps;
  # "-" or empty = no window). Writes to the heat pump only when the day is changed in HA; only windows that
  # differ are written, then the day is read back.
  - id: ww_programm_schreiben
    mode: queued
    parameters:
      tag: int
      eingabe: string
    then:
      - lambda: |-
          std::string s;
          for (const char c : eingabe) if (c != ' ') s += c;
          std::array<std::uint16_t, 3> raw{0x8080, 0x8080, 0x8080};
          std::size_t n = 0;
          bool ok = tag >= 0 && tag < 7;
          if (ok && !s.empty() && s != "-") {
            std::size_t pos = 0;
            while (true) {
              const std::size_t end = s.find_first_of(",;", pos);
              const std::string part = s.substr(pos, end == std::string::npos ? std::string::npos : end - pos);
              unsigned h1, m1, h2, m2;
              char rest;
              if (n >= 3 || sscanf(part.c_str(), "%u:%u-%u:%u%c", &h1, &m1, &h2, &m2, &rest) != 4 || h1 > 23 ||
                  m1 > 45 || m1 % 15 != 0 || m2 > 45 || m2 % 15 != 0 || h2 > 24 || (h2 == 24 && m2 != 0)) {
                ok = false;
                break;
              }
              raw[n++] = static_cast<std::uint16_t>(((4U * h1 + m1 / 15U) << 8) | (4U * h2 + m2 / 15U));
              if (end == std::string::npos) break;
              pos = end + 1;
            }
          }
          const std::array<template_::TemplateText *, 7> days{id(WW_PROGRAMM_MO), id(WW_PROGRAMM_DI),
              id(WW_PROGRAMM_MI), id(WW_PROGRAMM_DO), id(WW_PROGRAMM_FR), id(WW_PROGRAMM_SA), id(WW_PROGRAMM_SO)};
          if (!ok) {
            ESP_LOGW("WW", "Warmwasserprogramm: '%s' not understood (e.g. '06:00-08:00, 17:00-18:30', at most 3 "
                     "windows, 15-min steps, '-' = none)", eingabe.c_str());
            if (tag >= 0 && tag < 7) days[tag]->publish_state(days[tag]->state);
            return;
          }
          for (std::size_t w = 0; w < 3; ++w) {
            const std::size_t i = 3 * tag + w;
            if (((id(ww_programm_valid) >> i) & 1UL) && id(ww_programm)[i] == raw[w]) continue;
            const std::uint16_t addr = 0x1710 + 0x10 * tag + w;
            ESP_LOGI("WW", "Warmwasserprogramm day %d window %u: 0x%04x", tag, static_cast<unsigned>(w + 1), raw[w]);
            queueTransmission(CanNode::Kessel, Property(addr), raw[w]);
          }
      - delay: 5s
      - lambda: |-
          for (std::size_t w = 0; w < 3; ++w) {
            queueRequest(CanNode::Kessel, Property(static_cast<std::uint16_t>(0x1710 + 0x10 * tag + w)));
          }
  # Error list: request the 5 newest entries from the WPM3i like the control panel does (write of 0x0B9A to the
  # Manager; it only triggers the answer), then publish them.
  - id: fehlerliste_lesen
    mode: single
    then:
      - lambda: |-
          for (auto &entry : id(fehlerliste)) {
            entry.fill(0);
          }
      - repeat:
          count: 5
          then:
            - lambda: |-
                queueTransmission(CanNode::Manager, Property::kFEHLERLISTE_INDEX, static_cast<std::uint16_t>(iteration));
            - delay: 2s
      # The WPM3i keeps a cursor: every request returns the next entry (the index sent is ignored; each answer names
      # its index in 0x0B9A); after a pause of ~1 min it starts at entry 0 again. If the ESP missed fields, wait for
      # that reset and read the 5 entries once more, keeping what was received.
      - if:
          condition:
            lambda: |-
              for (const auto &e : id(fehlerliste)) {
                if (e[0] == 0 || e[3] == 0 || e[4] == 0 || e[5] == 0) {
                  return true;
                }
              }
              return false;
          then:
            - lambda: ESP_LOGI("Fehlerliste", "Entries incomplete, reading them again in 2 min");
            - delay: 2min
            - repeat:
                count: 5
                then:
                  - lambda: |-
                      queueTransmission(CanNode::Manager, Property::kFEHLERLISTE_INDEX, static_cast<std::uint16_t>(iteration));
                  - delay: 2s
      - lambda: |-
          std::string list;
          std::string newest;
          for (const auto &e : id(fehlerliste)) {
            if (e[0] == 0) {
              continue;
            }
            const auto it = id(fehler_texte).find(e[0]);
            // day, month and year are never 0: 0 = not received (shown as ??)
            const auto part = [](int v) {
              char b[4];
              snprintf(b, sizeof(b), "%02d", v);
              return v == 0 ? std::string("??") : std::string(b);
            };
            char time_part[8];
            snprintf(time_part, sizeof(time_part), "%02d:%02d", e[2], e[1]);
            const std::string entry = part(e[3]) + "." + part(e[4]) + "." + part(e[5]) + " " + time_part + " " +
                                      (it != id(fehler_texte).end() ? it->second : std::string("unbekannt")) + " (" +
                                      to_string(e[0]) + ")";
            if (newest.empty()) {
              newest = entry;
            }
            list += (list.empty() ? "" : "; ") + entry;
          }
          if (list.empty()) {
            list = "keine";
            newest = "keiner";
          }
          if (list.size() > 250) {
            list = list.substr(0, 247) + "...";
          }
          ESP_LOGI("Fehlerliste", "%s", list.c_str());
          id(FEHLERLISTE).publish_state(list);
          id(LETZTER_FEHLER).publish_state(newest);
  # Decide which mode is active: a real FEK wins; otherwise the selected mode. Called every 10 s and on changes.
  - id: heating_control_update
    mode: queued
    then:
      - lambda: |-
          if (id(fek_state) == 2 && millis() - id(fek_last_seen) > 10UL * 60UL * 1000UL) {
            ESP_LOGI("FEK", "No sign of the FEK for 10 min, checking again");
            id(fek_state) = 0;
          }
          const bool emulation_selected = id(HEIZUNGSSTEUERUNG).active_index().value_or(0) == 1;
          const bool setpoint_valid = !std::isnan(id(fek_flow_setpoint)());
          const bool want = emulation_selected && id(fek_state) == 1 && setpoint_valid;
          if (want && !id(fek_registered)) {
            ESP_LOGI("FEK", "Starting the FEK emulation");
            id(fek_registered) = true;
            id(fek_register).execute();
          } else if (!want && id(fek_registered)) {
            ESP_LOGW("FEK", "Stopping the FEK emulation (%s): the WPM3i takes HK1 back at its next check (<= 8 min)",
                     !emulation_selected ? "not selected" : !setpoint_valid ? "no valid outdoor temperature" : "FEK check");
            id(fek_registered) = false;
          }
          if (emulation_selected && !setpoint_valid) {
            ESP_LOGW("FEK", "FEK emulation selected, but no flow setpoint can be computed (outdoor temperature missing)");
          }
          id(heating_settings_locked) = !(id(fek_state) == 1 && !id(fek_registered));
          const char* mode = id(fek_state) == 2 ? "FEK installiert"
                           : id(fek_state) == 0 ? "Prüfung läuft"
                           : id(fek_registered) ? "FEK Emulation" : "Wärmepumpe";
          if (id(HEIZUNGSSTEUERUNG_AKTIV).state != mode) {
            id(HEIZUNGSSTEUERUNG_AKTIV).publish_state(mode);
          }
          if (id(fek_state) != 0 && (!id(FEK_INSTALLIERT).has_state() || id(FEK_INSTALLIERT).state != (id(fek_state) == 2))) {
            id(FEK_INSTALLIERT).publish_state(id(fek_state) == 2);
          }

  # Register as FEK, like the FEK2 when plugged in
  - id: fek_register
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("FEK", "Registering as FEK on 0x301");
          id(fek_send)(0x301, 6, 0xfd, 0x0900);
      - delay: 10s
      - if:
          condition:
            lambda: 'return id(fek_registered);'
          then:
            - lambda: |-
                id(fek_send)(0x180, 6, 0xfe, 0x0100);  // system message 0x00fe to the Kessel and to 0x601
                id(fek_send)(0x601, 6, 0xfe, 0x0100);
            - delay: 1s
            - script.execute: fek_send_setpoint
            - delay: 2s
            - script.execute: fek_send_room_values

  # Flow setpoint and the FEK2's other periodic values. 0x0058 = phase (0x0200 Komfort, 0x0100 Eco/Aus);
  # 0x006e, 0x0029, 0x002a unknown, copied (the FEK2 sends 0x006e = 0x0100 after plug-in, then 0x0200)
  - id: fek_send_setpoint
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(fek_registered) && !std::isnan(id(fek_flow_setpoint)());'
          then:
            - lambda: |-
                const float flow = id(fek_flow_setpoint)();
                const auto raw = static_cast<std::uint16_t>(lroundf(flow * 10.0f));
                ESP_LOGI("FEK", "Sending flow setpoint %.1f °C (outdoor %.1f °C, room %.1f °C)", flow,
                         id(AUSSENTEMP).state, id(fek_ha_temperature).state);
                id(FEK_VORLAUF_SOLL).publish_state(flow);
                id(VORLAUFSOLLTEMP).publish_state(flow);  // the ESP is HK1: its own HK1 reads get no answer
                const bool eco = id(FEK_BETRIEBSART).active_index().value_or(0) == 1;
                id(fek_send)(0x180, 0, 0x0002, raw);
                id(fek_send)(0x180, 0, 0x0058, eco ? 0x0100 : 0x0200);
                id(fek_send)(0x180, 0, 0x006e, 0x0100);
            - delay: 2s
            - lambda: |-
                if (!id(fek_registered)) return;
                const bool eco = id(FEK_BETRIEBSART).active_index().value_or(0) == 1;
                const float room_set = eco ? id(FEK_ECO_TEMP).state : id(FEK_KOMF_TEMP).state;
                id(fek_send)(0x601, 0, 0x0058, eco ? 0x0100 : 0x0200);
                id(fek_send)(0x601, 0, 0x0029, 0x0a00);
                id(fek_send)(0x601, 0, 0x002a, 0x1e00);
                id(fek_send)(0x601, 0, 0x010f, 0x0200);  // RAUMEINFLUSS 2 (little endian), like the FEK2
                id(fek_send)(0x601, 0, 0x0012, static_cast<std::uint16_t>(lroundf(room_set * 10.0f)));  // VERSTELLTE_RAUMSOLLTEMP
            - delay: 8s
            - lambda: |-
                const float flow = id(fek_flow_setpoint)();
                if (!id(fek_registered) || std::isnan(flow)) return;
                id(fek_send)(0x601, 0, 0x0004, static_cast<std::uint16_t>(lroundf(flow * 10.0f)));  // VORLAUFSOLLTEMP

  # Room temperature and humidity from HA, written as the FEK did (0x301 -> 0x601)
  - id: fek_send_room_values
    mode: single
    then:
      - lambda: |-
          if (!id(fek_registered)) return;
          const float temp = id(fek_ha_temperature).state;
          const float hum = id(fek_ha_humidity).state;
          if (std::isnan(temp) || temp < 5.0f || temp > 35.0f) {
            ESP_LOGW("FEK", "Room temperature from HA invalid (%.1f °C), not sending", temp);
          } else {
            id(fek_send)(0x601, 0, Property::kRAUMISTTEMP.id, static_cast<std::uint16_t>(lroundf(temp * 10.0f)));
          }
          if (std::isnan(hum) || hum <= 0.0f || hum > 100.0f) {
            ESP_LOGW("FEK", "Humidity from HA invalid (%.1f %%), not sending", hum);
          } else {
            id(fek_send)(0x601, 0, Property::kRAUMFEUCHTE.id, static_cast<std::uint16_t>(lroundf(hum * 10.0f)));
          }

#########################################
#                                       #
#   Intervals                           #
#                                       #
#########################################
interval:
  # Warmwasserprogramm: refresh every 15 min (also catches changes made on the control panel)
  - interval: 15min
    then:
      - script.execute: ww_programm_lesen
      - lambda: |-
          // Settings shown as text, Aufheizprogramm, Ferienprogramm
          queueRequest(CanNode::Kessel, Property::kEINSATZGRENZE_HZG);
          queueRequest(CanNode::Kessel, Property::kEINSATZGRENZE_WW);
          queueRequest(CanNode::Kessel, Property::kFESTWERTBETRIEB);
          queueRequest(CanNode::Kessel, Property::kAUFHEIZPROGRAMM);
          queueRequest(CanNode::Kessel, Property::kSOMMERBETRIEB);
          queueRequest(CanNode::Kessel, Property::kANTILEGIONELLEN);
          queueRequest(CanNode::Kessel, Property::kPUMPENZYKLEN);
          queueRequest(CanNode::Kessel, Property::kPUFFERBETRIEB);
          if (!id(fek_registered)) {
            for (std::size_t i = 0; i < 21; ++i) {
              queueRequest(CanNode::HK1, Property(static_cast<std::uint16_t>(0x1410 + 0x10 * (i / 3) + (i % 3))));
            }
          }
          for (const auto &p : {Property::kFERIEN_BEGINN_TAG, Property::kFERIEN_BEGINN_MONAT, Property::kFERIEN_BEGINN_JAHR,
                                Property::kFERIEN_ENDE_TAG, Property::kFERIEN_ENDE_MONAT, Property::kFERIEN_ENDE_JAHR}) {
            queueRequest(CanNode::Manager, p);
          }
  # Error list: refresh once a day
  - interval: 24h
    then:
      - script.execute: fehlerliste_lesen
  # CAN nodes on the bus: publish frames per hour per sender (sliding window of the last 60 minutes, updated every
  # minute); unknown senders are summed and listed. In the first 10 minutes after boot the rates are unknown, until
  # 60 minutes they are extrapolated to one hour.
  - interval: 60s
    then:
      - lambda: |-
          static const std::array<std::pair<std::uint16_t, sensor::Sensor*>, 7> known{{
              {0x100, id(CAN_RATE_BEDIENTEIL)}, {0x180, id(CAN_RATE_KESSEL)}, {0x301, id(CAN_RATE_HK1)},
              {0x480, id(CAN_RATE_MANAGER)},    {0x601, id(CAN_RATE_0X601)},  {0x680, id(CAN_RATE_0X680)},
              {0x700, id(CAN_RATE_MFG)}}};
          static constexpr std::size_t kMinMinutes = 10;
          auto &frames = id(can_frames);
          auto &window = id(can_frames_window);
          auto &pos = id(can_frames_window_pos);
          auto &fill = id(can_frames_window_fill);
          const auto now = id(homeassistant_time).now();
          std::uint32_t unknown = 0;
          for (const auto &[can_id, count] : frames) {
            const auto key = can_id;
            const bool is_known = std::any_of(known.begin(), known.end(),
                                              [key](const auto &k) { return k.first == key; });
            if (!is_known && count > 0) {
              unknown += count;
              if (now.is_valid()) {
                id(can_unknown_last_seen)[key] = now.timestamp;
              } else if (!id(can_unknown_last_seen).count(key)) {
                id(can_unknown_last_seen)[key] = 0;
              }
              ESP_LOGI("CAN nodes", "Unknown sender 0x%03X: %u frames in the last minute", key,
                       static_cast<unsigned>(count));
            }
          }
          // Sliding window of the last 60 minutes: slots 0-6 = known senders, slot 7 = unknown senders
          auto &slot = window[pos];
          for (std::size_t i = 0; i < known.size(); i++) {
            const auto it = frames.find(known[i].first);
            slot[i] = static_cast<std::uint16_t>(std::min<std::uint32_t>(it != frames.end() ? it->second : 0, 0xffff));
          }
          slot[known.size()] = static_cast<std::uint16_t>(std::min<std::uint32_t>(unknown, 0xffff));
          pos = (pos + 1) % window.size();
          if (fill < window.size()) {
            fill++;
          }
          const auto per_hour = [&window, fill](std::size_t index) -> float {
            if (fill < kMinMinutes) {
              return NAN;
            }
            std::uint32_t sum = 0;
            for (const auto &minute : window) {  // unused slots are 0
              sum += minute[index];
            }
            return static_cast<float>(sum) * window.size() / fill;
          };
          for (std::size_t i = 0; i < known.size(); i++) {
            known[i].second->publish_state(per_hour(i));
          }
          id(CAN_RATE_UNKNOWN).publish_state(per_hour(known.size()));
          std::string list;
          for (const auto &[can_id, last] : id(can_unknown_last_seen)) {
            char entry[48];
            if (last > 0) {
              const auto t = ESPTime::from_epoch_local(last);
              snprintf(entry, sizeof(entry), "%s0x%03X (%02d.%02d. %02d:%02d)", list.empty() ? "" : ", ", can_id,
                       t.day_of_month, t.month, t.hour, t.minute);
            } else {
              snprintf(entry, sizeof(entry), "%s0x%03X", list.empty() ? "" : ", ", can_id);
            }
            list += entry;
          }
          if (list.empty()) {
            list = "keine";
          }
          if (list.size() > 250) {
            list = list.substr(0, 247) + "...";
          }
          if (id(CAN_UNKNOWN_SENDERS).state != list) {
            id(CAN_UNKNOWN_SENDERS).publish_state(list);
          }
          frames.clear();
  # Heating control: send queued FEK frames (one every 30 ms, the FEK2 spaces them 10-20 ms)
  - interval: 30ms
    then:
      - lambda: |-
          auto& queue = id(fek_tx_queue);
          if (queue.empty()) return;
          const auto& data = queue.front();
          char buf[32];
          int n = 0;
          for (const auto b : data) n += snprintf(buf + n, sizeof(buf) - n, " %02X", b);
          ESP_LOGD("FEK", "Sending as 0x301:%s", buf);
          id(wp_can).send_data(0x301, false, data);
          queue.erase(queue.begin());
  # Heating control: FEK check (software version of HK1 vs. Manager) and mode decision
  - interval: 60s
    startup_delay: 5s
    then:
      - lambda: |-
          if (id(sw_version_manager) < 0) {
            queueRequest(CanNode::Manager, Property::kFET_SOFTWARE);
          }
          if (id(sw_revision_manager) < 0) {
            queueRequest(CanNode::Manager, Property::kFET_SOFTWARESTAND);
          }
          queueRequest(CanNode::HK1, Property::kFET_SOFTWARE);
          if (!id(fek_registered)) {
            queueRequest(CanNode::HK1, Property::kFET_SOFTWARESTAND);  // diagnostic sensor "Software HK1"
          }
          id(software_publish)();
  - interval: 10s
    then:
      - script.execute: heating_control_update
  # FEK emulation: system message 0x00fe every 7 min, flow setpoint every 3 min, room values every minute
  - interval: 7min
    then:
      - lambda: |-
          if (id(fek_registered)) {
            id(fek_send)(0x180, 6, 0xfe, 0x0100);
            id(fek_send)(0x601, 6, 0xfe, 0x0100);
          }
  - interval: 3min
    then:
      - script.execute: fek_send_setpoint
  - interval: 60s
    then:
      - script.execute: fek_send_room_values
  - interval: $interval_fast
    then:
      - lambda: |-
          queueRequest(CanNode::Manager, Property::kBETRIEBS_STATUS_WPM);
          queueRequest(CanNode::Manager, Property::kPROGRAMMSCHALTER);
  - interval: $interval_once_in_a_while
    then:
      - lambda: |-
          queueRequest(CanNode::Kessel, Property::kEINPHASIGER_BETRIEB);
  # Settings (numbers/switch) are otherwise only requested once at boot. Refresh them, so a lost answer or a change on
  # the control panel shows up.
  - interval: $interval_very_slow
    then:
      - lambda: |-
          for (const auto& property : {Property::kKOMF_TEMP, Property::kECO_TEMP, Property::kSTEIGUNG_HK1, Property::kRAUMEINFLUSS}) {
            queueRequest(CanNode::HK1, property);
          }
          for (const auto& property : {Property::kWW_KOMF_TEMP, Property::kWW_ECO_TEMP, Property::kWW_HYSTERESE,
                                       Property::kKUEHLEN_EIN, Property::kKUEHLMODE, Property::kFLAECHENKUEHLUNG,
                                       Property::kVORLAUFSOLLTEMP_KUEHLEN, Property::kRAUMSOLLTEMP_KUEHLEN,
                                       Property::kHYSTERESE_VORLAUFTEMP_KUEHLEN,
                                       Property::kLEISTUNG_HEIZKREISPUMPE, Property::kLEISTUNG_SOLEPUMPE,
                                       Property::kLEISTUNG_WARMWASSERPUMPE, Property::kVERDICHTER_STILLSTAND,
                                       Property::kREGLERDYNAMIK, Property::kGEBLAESEKUEHLUNG}) {
            queueRequest(CanNode::Kessel, property);
          }

#########################################
#                                       #
#   Packages                            #
#                                       #
#########################################
packages:
  TTF07_BASE:                    !include { file: ttf07_base.yaml }  # -> txx_base.yaml -> core.yaml
  MANAGER:                       !include { file: templates/wp_can_id.yaml, vars: { can_node: "Manager", can_id: "0x480" }}
  BEDIENTEIL:                    !include { file: templates/wp_can_id.yaml, vars: { can_node: "Bedienteil", can_id: "0x100" }}  # most likely the control panel

# Programmschalter (on the WPM3i)
  PROGRAMMSCHALTER:              !include { file: templates/wp_select.yaml, vars: { property: PROGRAMMSCHALTER, target: "Manager", mapper_func_set: getBetriebsartId, mapper_func_get: getBetriebsart, options: ["Notbetrieb", "Bereitschaft", "Programm", "Komfort", "Eco", "Warmwasser", "Unbekannt"] }}

# Betriebsstatus: the binaries of ttf07_base.yaml plus these, all decoded from BETRIEBS_STATUS_WPM (see on_boot)
  MISCHER_PUMPE:                 !include { file: templates/wp_binary.yaml, vars: { name: "MISCHER_PUMPE" }}
  MISCHER_AUF:                   !include { file: templates/wp_binary.yaml, vars: { name: "MISCHER_AUF" }}
  MISCHER_ZU:                    !include { file: templates/wp_binary.yaml, vars: { name: "MISCHER_ZU" }}
  ENTLEERUNG_HYD:                !include { file: templates/wp_binary.yaml, vars: { name: "ENTLEERUNG_HYD" }}
  HEIZBETRIEB:                   !include { file: templates/wp_binary.yaml, vars: { name: "HEIZBETRIEB" }}

# Temperatures
  VORLAUFISTTEMPNHZ:             !include { file: templates/wp_temperature.yaml, vars: { property: "VORLAUFISTTEMPNHZ", update_interval: $interval_medium, target: "MFG" }}

# COP
  COP_WW:                        !include { file: templates/wp_cop.yaml, vars: { sensor_name: "COP_WW",         output_property: "WAERMEERTRAG_WW_SUMME_MWH",   input_property: "EL_ENERGIEAUFNAHME_WW_SUMME_MWH" }}
  COP_HEIZEN:                    !include { file: templates/wp_cop.yaml, vars: { sensor_name: "COP_HEIZEN",     output_property: "WAERMEERTRAG_HEIZ_SUMME_MWH", input_property: "EL_ENERGIEAUFNAHME_HEIZ_SUMME_MWH" }}

# Power
  VERSORGUNGSSPANNUNG:           !include { file: templates/wp_generic.yaml, vars: { property: "VERSORGUNGSSPANNUNG", unit: "V", icon: "mdi:lightning-bolt", accuracy_decimals: "1", update_interval: "${interval_fast}", target: "MFG" }}
  STROMAUFNAHME:                 !include { file: templates/wp_generic.yaml, vars: { property: "STROMAUFNAHME", unit: "A", icon: "mdi:current-ac", accuracy_decimals: "1", update_interval: "${interval_fast}", target: "MFG" }}
  LEISTUNG_VERDICHTER:           !include { file: templates/wp_power.yaml, vars: { sensor_name: "LEISTUNG_VERDICHTER", id_current: "STROMAUFNAHME", id_voltage: "VERSORGUNGSSPANNUNG" }}

# Betriebsstunden
  LAUFZEIT_VD_HEIZEN:            !include { file: templates/wp_generic.yaml, vars: { property: "LAUFZEIT_VD_HEIZEN", update_interval: "${interval_once_in_a_while}" }}
  LAUFZEIT_VD_WW:                !include { file: templates/wp_generic.yaml, vars: { property: "LAUFZEIT_VD_WW", update_interval: "${interval_once_in_a_while}" }}
  LAUFZEIT_VD_KUEHLEN:           !include { file: templates/wp_generic.yaml, vars: { property: "LAUFZEIT_VD_KUEHLEN", update_interval: "${interval_once_in_a_while}" }}
  LAUFZEIT_NHZ1:                 !include { file: templates/wp_generic.yaml, vars: { property: "LAUFZEIT_NHZ1", update_interval: "${interval_once_in_a_while}" }}
  LAUFZEIT_NHZ2:                 !include { file: templates/wp_generic.yaml, vars: { property: "LAUFZEIT_NHZ2", update_interval: "${interval_once_in_a_while}" }}
  LAUFZEIT_NHZ1_2:               !include { file: templates/wp_generic.yaml, vars: { property: "LAUFZEIT_NHZ1_2", update_interval: "${interval_once_in_a_while}" }}

# Settings (pump powers, Verdichter Stillstand and Reglerdynamik: read-only sensors in ttf07.yaml, numbers here)
  KOMF_TEMP:                     !include { file: templates/wp_number.yaml, vars: { write_lock: "id(heating_settings_locked)", property: "KOMF_TEMP", mode: "box", min: "15", max: "30", step: "0.5", icon: "mdi:valve", target: "HK1" }}
  ECO_TEMP:                      !include { file: templates/wp_number.yaml, vars: { write_lock: "id(heating_settings_locked)", property: "ECO_TEMP", mode: "box", min: "15", max: "30", step: "0.5", icon: "mdi:valve", target: "HK1" }}
  WW_KOMF_TEMP:                  !include { file: templates/wp_number.yaml, vars: { property: "WW_KOMF_TEMP", mode: "box", min: "20", max: "60", step: "0.5", icon: "mdi:valve" }}
  WW_ECO_TEMP:                   !include { file: templates/wp_number.yaml, vars: { property: "WW_ECO_TEMP", mode: "box", min: "20", max: "60", step: "0.5", icon: "mdi:valve" }}
  WW_HYSTERESE:                  !include { file: templates/wp_number.yaml, vars: { property: "WW_HYSTERESE", mode: "box", min: "1", max: "10", step: "1", icon: "mdi:valve" }}
  KUEHLEN_EIN:                   !include { file: templates/wp_switch.yaml, vars: { property: "KUEHLEN_EIN", icon: "mdi:snowflake" }}
  KUEHLMODE:                     !include { file: templates/wp_switch.yaml, vars: { property: "KUEHLMODE", icon: "mdi:snowflake-alert" }}
  FLAECHENKUEHLUNG:              !include { file: templates/wp_switch.yaml, vars: { property: "FLAECHENKUEHLUNG", icon: "mdi:heating-coil" }}
  GEBLAESEKUEHLUNG:              !include { file: templates/wp_switch.yaml, vars: { property: "GEBLAESEKUEHLUNG", icon: "mdi:fan" }}
  VORLAUFSOLLTEMP_KUEHLEN:       !include { file: templates/wp_number.yaml, vars: { property: "VORLAUFSOLLTEMP_KUEHLEN", mode: "box", min: "15", max: "25", step: "0.1", unit: "°C", icon: "mdi:snowflake-thermometer" }}
  RAUMSOLLTEMP_KUEHLEN:          !include { file: templates/wp_number.yaml, vars: { property: "RAUMSOLLTEMP_KUEHLEN", mode: "box", min: "18", max: "30", step: "0.1", unit: "°C", icon: "mdi:home-thermometer" }}
  KUEHLEN_HYSTERESE:             !include { file: templates/wp_number.yaml, vars: { property: "HYSTERESE_VORLAUFTEMP_KUEHLEN", mode: "box", min: "0.5", max: "5", step: "0.1", unit: "K", icon: "mdi:valve" }}
  LEISTUNG_HEIZKREISPUMPE:       !include { file: templates/wp_number.yaml, vars: { property: "LEISTUNG_HEIZKREISPUMPE", mode: "box", min: "10", max: "100", step: "5", unit: "%", icon: "mdi:water-percent" }}
  LEISTUNG_SOLEPUMPE:            !include { file: templates/wp_number.yaml, vars: { property: "LEISTUNG_SOLEPUMPE", mode: "box", min: "10", max: "100", step: "5", unit: "%", icon: "mdi:water-percent" }}
  LEISTUNG_WARMWASSERPUMPE:      !include { file: templates/wp_number.yaml, vars: { property: "LEISTUNG_WARMWASSERPUMPE", mode: "box", min: "10", max: "100", step: "5", unit: "%", icon: "mdi:water-percent" }}
  VERDICHTER_STILLSTAND:         !include { file: templates/wp_number.yaml, vars: { property: "VERDICHTER_STILLSTAND", mode: "box", min: "10", max: "120", step: "5", unit: "min" }}
  REGLERDYNAMIK:                 !include { file: templates/wp_number.yaml, vars: { property: "REGLERDYNAMIK", mode: "box", min: "1", max: "30" }}

# Pumps and valve as commanded by the WPM3i to the MFG (diagnostic).
# PWM is inverted: 100 % = pump off, lower = faster (about 100 - the pump power setting).
  PWM_QUELLENPUMPE:              !include { file: templates/wp_debug.yaml, vars: { sensor_id: "PWM_QUELLENPUMPE", property: "PWM_QUELLENPUMPE", target: "Manager", unit: "%", icon: "mdi:pump" }}
  PWM_LADEPUMPE:                 !include { file: templates/wp_debug.yaml, vars: { sensor_id: "PWM_LADEPUMPE", property: "PWM_LADEPUMPE", target: "Manager", unit: "%", icon: "mdi:pump" }}
  UMSCHALTVENTIL_WW:             !include { file: templates/wp_debug.yaml, vars: { sensor_id: "UMSCHALTVENTIL_WW", property: "UMSCHALTVENTIL_WW", target: "Manager", unit: "%", icon: "mdi:valve" }}

# Room values sent by a FEK2 (diagnostic)
  FEK_RAUMISTTEMP_HK1:           !include { file: templates/wp_debug.yaml, vars: { sensor_id: "FEK_RAUMTEMPERATUR_HK1", property: "RAUMISTTEMP", target: "HK1" }}
  FEK_RAUMFEUCHTE_HK1:           !include { file: templates/wp_debug.yaml, vars: { sensor_id: "FEK_RAUMFEUCHTE", property: "RAUMFEUCHTE", unit: "%", icon: "mdi:water-percent", target: "HK1", accuracy_decimals: "1" }}

  # Error number of the WPM3i (sent to the control panel every ~3.5 min; 0 = no error, 21 = Keine Leistung)
  FEHLERNUMMER_WPM:              !include { file: templates/wp_debug.yaml, vars: { sensor_id: "FEHLERNUMMER_WPM", property: "FEHLERNUMMER_WPM", target: "Manager", icon: "mdi:alert-circle" }}
  # Minutes until the compressor may start again (Diagnose > Status Wärmepumpe > Reststillstand; counts down from
  # VERDICHTER_STILLSTAND = 60 min after a compressor stop)
  VERDICHTER_RESTSTILLSTAND:     !include { file: templates/wp_generic.yaml, vars: { property: "VERDICHTER_RESTSTILLSTAND", target: "Manager", unit: "min", icon: "mdi:timer-sand", update_interval: "60s" }}
  # Settings from the expert menus
  SOMMERBETRIEB_HEIZGRENZE:      !include { file: templates/wp_temperature.yaml, vars: { property: "SOMMERBETRIEB_HEIZGRENZE" }}
  MAXVORLAUFTEMP:                !include { file: templates/wp_temperature.yaml, vars: { property: "MAXVORLAUFTEMP" }}
  MAXRUECKLAUFTEMP:              !include { file: templates/wp_temperature.yaml, vars: { property: "MAXRUECKLAUFTEMP" }}
  SOMMERBETRIEB:                 !include { file: templates/wp_binary.yaml, vars: { name: "SOMMERBETRIEB" }}
  ANTILEGIONELLEN:               !include { file: templates/wp_binary.yaml, vars: { name: "ANTILEGIONELLEN" }}
  PUMPENZYKLEN:                  !include { file: templates/wp_binary.yaml, vars: { name: "PUMPENZYKLEN" }}
  PUFFERBETRIEB:                 !include { file: templates/wp_binary.yaml, vars: { name: "PUFFERBETRIEB" }}
  HEIZ_ANFORDERUNG_HK1:          !include { file: templates/wp_binary.yaml, vars: { name: "HEIZ_ANFORDERUNG_HK1" }}
  # Found in the expert menus
  TAUPUNKT_HK1:                  !include { file: templates/wp_temperature.yaml, vars: { property: "TAUPUNKT_HK1", update_interval: $interval_slow }}
  RAUMISTTEMP_WPM:               !include { file: templates/wp_temperature.yaml, vars: { property: "RAUMISTTEMP_WPM", target: "Manager", update_interval: $interval_slow }}
  RAUMSOLLTEMP_WPM:              !include { file: templates/wp_temperature.yaml, vars: { property: "RAUMSOLLTEMP_WPM", target: "Manager", update_interval: $interval_slow }}
  RAUMFEUCHTE_WPM:               !include { file: templates/wp_generic.yaml, vars: { property: "RAUMFEUCHTE_WPM", target: "Manager", unit: "%", accuracy_decimals: "1", icon: "mdi:water-percent", update_interval: $interval_slow }}
  BIVALENZTEMPERATUR_HZG:        !include { file: templates/wp_temperature.yaml, vars: { property: "BIVALENZTEMPERATUR_HZG" }}
  BIVALENZTEMPERATUR_WW:         !include { file: templates/wp_temperature.yaml, vars: { property: "BIVALENZTEMPERATUR_WW" }}
  NHZ_WAERME_HEIZ_SUMME:         !include { file: templates/wp_generic_combined.yaml, vars: { sensor_name: "NHZ_WAERME_HEIZ_SUMME", scaled_property: "NHZ_WAERME_HEIZ_SUM_KWH", property: "WAERMEERTRAG_2WE_HEIZ_SUM_MWH", device_class: "energy", unit: "MWh", accuracy_decimals: "3", icon: "mdi:heating-coil" }}
  NHZ_WAERME_WW_SUMME:           !include { file: templates/wp_generic_combined.yaml, vars: { sensor_name: "NHZ_WAERME_WW_SUMME", scaled_property: "NHZ_WAERME_WW_SUM_KWH", property: "NHZ_WAERME_WW_SUM_MWH", device_class: "energy", unit: "MWh", accuracy_decimals: "3", icon: "mdi:heating-coil" }}
  PARTYPROGRAMM:                 !include { file: templates/wp_generic.yaml, vars: { property: "PARTYPROGRAMM", target: "Manager", unit: "h", icon: "mdi:party-popper", update_interval: $interval_slow }}
  AUFHEIZPROGRAMM:               !include { file: templates/wp_binary.yaml, vars: { name: "AUFHEIZPROGRAMM" }}

#########################################
#                                       #
#   Binary sensors                      #
#                                       #
#########################################
binary_sensor:
  # Heating control: a real FEK is installed (published by heating_control_update)
  - platform: template
    name: "FEK installiert"
    id: FEK_INSTALLIERT
    icon: "mdi:thermostat-box"

  # trigger recalculation of LEISTUNG_*, when one of following sensors change
  - id: !extend HEIZKREISPUMPE
    on_state:
      then:
        - component.update: LEISTUNG_EXT_HEIZKREISPUMPE
        - component.update: LEISTUNG_SUMME

  - id: !extend HEIZBETRIEB
    on_state:
      then:
        - component.update: LEISTUNG_HEIZEN
        - component.update: LEISTUNG_SUMME

  - id: !extend WARMWASSERBEREITUNG
    on_state:
      then:
        - component.update: LEISTUNG_WARMWASSERBEREITUNG
        - component.update: LEISTUNG_SUMME

#########################################
#                                       #
#   Thermostats                         #
#                                       #
#########################################
# Heating as one thermostat; its targets follow who controls heating ("Heizungssteuerung aktiv"):
# - Wärmepumpe: preset Komfort/Eco = Programmschalter (WPM3i), target = HK1 Komfort or Eco temperature. (The
#   Programmschalter does not set the hot water setpoint: that is the Warmwasserprogramm, see "Warmwasser Modus".)
# - FEK Emulation: preset = "FEK Emulation Betriebsart", target = the emulation's Komfort or Eco temperature.
# - FEK installiert / Prüfung läuft: read only (the real FEK keeps its settings itself).
# Current temperature/humidity = the house values from Home Assistant, action = Heizbetrieb.
# Needs the external component wp_climate in the device file.
climate:
  - platform: wp_climate
    type: preset
    name: "Thermostat Heizung"
    id: THERMOSTAT_HEIZUNG
    icon: "mdi:home-thermometer"
    current_temp: fek_ha_temperature
    current_humidity: fek_ha_humidity
    comfort_temp: KOMF_TEMP
    eco_temp: ECO_TEMP
    preset_select: PROGRAMMSCHALTER
    alternative:
      comfort_temp: FEK_KOMF_TEMP
      eco_temp: FEK_ECO_TEMP
      preset_select: FEK_BETRIEBSART
    use_alternative: "return id(fek_registered);"
    writable: "return id(fek_state) == 1;"  # no real FEK, check done
    heating: HEIZBETRIEB

  # Hot water as a thermostat: preset Komfort/Eco = "Warmwasser Modus" (= the Warmwasserprogramm, see there), target =
  # WW Komfort or WW Eco temperature, current = Speicher Ist, action = Warmwasserbereitung. Not the Programmschalter:
  # it does not change the hot water setpoint (test 2026-11-18). With an own program ("Programm") there is no preset;
  # the target shows the Speicher Soll and is read only.
  - platform: wp_climate
    type: preset
    name: "Thermostat Warmwasser"
    id: THERMOSTAT_WARMWASSER
    icon: "mdi:water-boiler"
    current_temp: SPEICHERISTTEMP
    comfort_temp: WW_KOMF_TEMP
    eco_temp: WW_ECO_TEMP
    preset_select: WW_MODUS
    setpoint: SPEICHERSOLLTEMP
    heating: WARMWASSERBEREITUNG

