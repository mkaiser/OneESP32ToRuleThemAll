defaults:
  sensor_name: "HEATPUMP_DATETIME"
  target: Kessel

esphome:
  on_boot:
    priority: 100.0 # AFTER_CONNECTION
    then:
      - lambda: |-
            id(HEATPUMP_DATETIME).state = "2024-01-01 12:34";
            auto updateTime = [](auto&& updateTimeFragment){
                ESPTime timeToSet{};
                // get the datetime as string and parse to ESPTime object
                if(const auto success = ESPTime::strptime(id(HEATPUMP_DATETIME).state, timeToSet); !success) {
                  ESP_LOGE("DATETIME", "Error parsing datetime string %s", id(HEATPUMP_DATETIME).state.c_str());
                  return;
                }
                // update the part that belongs to this sensor
                updateTimeFragment(timeToSet);
                // convert the time back to string and directly save it to the state of the datetime sensor
                char buf[20];
                timeToSet.strftime(buf, sizeof(buf), "%Y-%m-%d %H:%M");
                // publish the value
                id(HEATPUMP_DATETIME).state = std::string(buf);
            };
            CallbackHandler::instance().addCallback(std::make_pair(${target},Property::kJAHR),[updateTime](const SimpleVariant& value){
              updateTime([&value](ESPTime& timeToSet){
                timeToSet.year = 2000U + static_cast<std::uint16_t>(value);
              });
            });
            CallbackHandler::instance().addCallback(std::make_pair(${target},Property::kMONAT),[updateTime](const SimpleVariant& value){
              updateTime([&value](ESPTime& timeToSet){
                timeToSet.month = static_cast<std::uint16_t>(value);
              });
            });
            CallbackHandler::instance().addCallback(std::make_pair(${target},Property::kWOCHENTAG),[](const SimpleVariant&){});
            CallbackHandler::instance().addCallback(std::make_pair(${target},Property::kTAG),[updateTime](const SimpleVariant& value){
              updateTime([&value](ESPTime& timeToSet){
                timeToSet.day_of_month = static_cast<std::uint16_t>(value);
              });
            });
            CallbackHandler::instance().addCallback(std::make_pair(${target},Property::kSTUNDE),[updateTime](const SimpleVariant& value){
              updateTime([&value](ESPTime& timeToSet){
                timeToSet.hour = static_cast<std::uint16_t>(value);
              });
            });
            CallbackHandler::instance().addCallback(std::make_pair(${target},Property::kMINUTE),[updateTime](const SimpleVariant& value){
              updateTime([&value](ESPTime& timeToSet){
                timeToSet.minute = static_cast<std::uint16_t>(value);
              });
              id(HEATPUMP_DATETIME).publish_state(id(HEATPUMP_DATETIME).state);
            });
            queueRequest(Kessel, Property::kJAHR);
            queueRequest(Kessel, Property::kMONAT);
            queueRequest(Kessel, Property::kTAG);
            queueRequest(Kessel, Property::kSTUNDE);
            queueRequest(Kessel, Property::kMINUTE);

text_sensor:
  - platform: template
    name: ${sensor_name}
    id: HEATPUMP_DATETIME
    update_interval: never



#########################################
#                                       #
#   Time Synchronization                #
#                                       #
#########################################
time:
  - platform: sntp
    id: sntp_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 3 # sync at 3 am should be ok even with switch from/to daylight saving time
        then:
          - lambda: |-
              ESP_LOGI("wp_datetime.yaml", "Auto Time sync");
              syncTime();  // TODO testme! reading the time from ttf07 works with WPM2, not Kessel 



#########################################
#                                       #
#   Buttons                             #
#                                       #
#########################################
button:
  - platform: template
    name: Synchronize Time
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("wp_datetime.yaml", "Timesync Button pressed");
            syncTime();  // WPM2 for TTF07

