        name: Raum Soll
      - entity: number.warmepumpe_kuhlen_hysterese
        name: Hysterese Vorlauf
      - entity: switch.warmepumpe_geblasekuhlung
        name: Gebläsekühlung
      - entity: binary_sensor.warmepumpe_kuehlbetrieb
        name: Kühlbetrieb
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Warmwasserprogramm
    - type: entities
      entities:
      - entity: text.warmepumpe_warmwasserprogramm_montag
        name: Montag
      - entity: text.warmepumpe_warmwasserprogramm_dienstag
        name: Dienstag
      - entity: text.warmepumpe_warmwasserprogramm_mittwoch
        name: Mittwoch
      - entity: text.warmepumpe_warmwasserprogramm_donnerstag
        name: Donnerstag
      - entity: text.warmepumpe_warmwasserprogramm_freitag
        name: Freitag
      - entity: text.warmepumpe_warmwasserprogramm_samstag
        name: Samstag
      - entity: text.warmepumpe_warmwasserprogramm_sonntag
        name: Sonntag
      grid_options:
