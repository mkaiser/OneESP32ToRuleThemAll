- title: Einstellungen
  path: einstellungen
  icon: mdi:cog
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Heizungssteuerung
      icon: mdi:home-thermometer
    - type: tile
      entity: sensor.warmepumpe_heizungssteuerung_aktiv
      name: Aktiv jetzt
      grid_options:
        columns: full
    - type: tile
      entity: select.warmepumpe_heizungssteuerung
      name: Heizungssteuerung
      features:
      - type: select-options
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: select.warmepumpe_programmschalter
      name: Programmschalter
      features:
      - type: select-options
      grid_options:
        columns: 6
        rows: 2
    - type: markdown
      content: '**FEK Emulation**: das ESP ist die Raumstation und berechnet den Vorlauf aus der Heizkurve unten. **Wärmepumpe**:
        die WPM3i regelt selbst (Einstellungen HK1). Mit echter FEK regelt die FEK; die HK1-Einstellungen sind dann gesperrt.
        **Heizungssteuerung** gilt nur ohne echte FEK; was gerade regelt, zeigt "Aktiv jetzt".'
  - type: grid
    cards:
    - type: heading
      heading: FEK Emulation (Heizkurve)
      icon: mdi:chart-bell-curve-cumulative
    - type: entities
      entities:
      - entity: select.warmepumpe_fek_emulation_betriebsart
        name: Betriebsart
      - type: section
        label: Eco = niedrigere Raumtemperatur; die Wärmepumpe heizt immer im Komfort-Betrieb
      - entity: number.warmepumpe_fek_emulation_komfort_temperatur
        name: Komfort
      - entity: number.warmepumpe_fek_emulation_eco_temperatur
        name: Eco
      - entity: number.warmepumpe_fek_emulation_steigung
        name: Steigung
      - entity: number.warmepumpe_fek_emulation_offset
        name: Offset
      - entity: number.warmepumpe_fek_emulation_raumeinfluss
        name: Raumeinfluss
      - entity: number.warmepumpe_fek_emulation_vorlauf_min
        name: Vorlauf min
      - entity: number.warmepumpe_fek_emulation_vorlauf_max
        name: Vorlauf max
      - entity: sensor.warmepumpe_fek_emulation_vorlauf_soll
        name: Vorlauf Soll (berechnet)
      grid_options:
        columns: full
    visibility:
    - condition: state
      entity: sensor.warmepumpe_heizungssteuerung_aktiv
      state:
      - FEK Emulation
      - Prüfung läuft
  - type: grid
    cards:
    - type: heading
      heading: Wärmepumpe allein (HK1)
      icon: mdi:heat-pump-outline
    - type: entities
      entities:
      - entity: number.warmepumpe_heizen_komfort_temperatur
        name: Komfort
      - entity: number.warmepumpe_heizen_eco_temperatur
        name: Eco
      - entity: number.warmepumpe_steigung_hk1
        name: Steigung
      - entity: number.warmepumpe_raumeinfluss
        name: Raumeinfluss
      grid_options:
        columns: full
    visibility:
    - condition: state
      entity: sensor.warmepumpe_heizungssteuerung_aktiv
      state: Wärmepumpe
  - type: grid
    cards:
    - type: heading
      heading: Warmwasser
      icon: mdi:water-boiler
    - type: entities
      entities:
      - entity: number.warmepumpe_ww_komfort_temperatur
        name: Komfort
      - entity: number.warmepumpe_ww_eco_temperatur
        name: Eco
      - entity: number.warmepumpe_ww_hysterese
        name: Hysterese
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Anlage
      icon: mdi:tune
    - type: entities
      entities:
      - entity: number.warmepumpe_pumpenleistung_heizkreis
        name: Pumpe Heizkreis
      - entity: number.warmepumpe_pumpenleistung_sole
        name: Pumpe Sole
      - entity: number.warmepumpe_pumpenleistung_warmwasser
        name: Pumpe Warmwasser
      - entity: number.warmepumpe_reglerdynamik
        name: Reglerdynamik
      - entity: number.warmepumpe_verdichter_stillstand
        name: Verdichter Stillstand
      - entity: button.warmepumpe_synchronize_time
        name: Uhrzeit synchronisieren
      - entity: sensor.warmepumpe_bivalenztemperatur_heizen
        name: Bivalenz Heizen
      - entity: sensor.warmepumpe_bivalenztemperatur_warmwasser
        name: Bivalenz Warmwasser
      - entity: sensor.warmepumpe_einsatzgrenze_heizen
        name: Einsatzgrenze Heizen
      - entity: sensor.warmepumpe_einsatzgrenze_warmwasser
        name: Einsatzgrenze Warmwasser
      - entity: sensor.warmepumpe_festwertsolltemperatur
        name: Festwertsolltemperatur
      - entity: sensor.warmepumpe_maximale_vorlauftemperatur
        name: Max. Vorlauf
