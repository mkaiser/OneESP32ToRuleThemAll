    - type: markdown
      content: 'Format `06:00-08:00, 17:00-18:30`: höchstens 3 Zeitfenster pro Tag, 15-Minuten-Schritte, `-` = keins. Eine
        Änderung wird in die Wärmepumpe geschrieben.'
  - type: grid
    cards:
    - type: heading
      heading: Programme
    - type: entities
      entities:
      - entity: sensor.warmepumpe_partyprogramm
        name: Partyprogramm
      - entity: binary_sensor.warmepumpe_aufheizprogramm
